  $$("#safetyBox input").forEach(i=>i.addEventListener("change", ()=>{
    if(i.value==="none" && i.checked) $$("#safetyBox input").forEach(o=>{ if(o!==i) o.checked=false; });
    if(i.value!=="none" && i.checked) $("#s_none").checked = false;
    safetyMsg();
  }));

  const min = new Date(); const max = new Date(); max.setDate(max.getDate()+CONFIG.bookingWindowDays);
  ["f_date","f_date2"].forEach(id=>{ const el=$("#"+id); el.min=iso(min); el.max=iso(max); });
  $("#f_date").value = iso(nextOpenDay());
  $("#openHint").textContent = "We are open on " + CONFIG.openDays.map(d=>DAYNAMES[d]).join(", ")
    + ". Choose a preferred slot — the clinic confirms the exact time when it replies.";
  $("#f_date").addEventListener("change", checkDay);
  $("#f_date2").addEventListener("change", checkDay);
  const _hs = $("#heroSlot"); if(_hs) _hs.textContent = fmtDate(iso(nextOpenDay())).replace(/,.*/,"") + " " + CONFIG.slots[0].replace(" ","");

  $("#slotBox").innerHTML = CONFIG.slots.map(s=>`<label class="opt">
    <input type="radio" name="slot" value="${esc(s)}"><span>${esc(s)}</span></label>`).join("");
  $$("#slotBox input").forEach(i=>i.addEventListener("change",()=>{ slot = i.value; }));

  $("#f_phone").addEventListener("input", e=>{ e.target.value = e.target.value.replace(/\D/g,"").slice(0,10); });
}
function renderMonths(){
  const pl = PLAN[$("#planSel").value];
  $("#monthOpts").innerHTML = pl.fees.map(f=>`<label class="opt">
    <input type="radio" name="months" value="${f.months}" ${f.months===months?"checked":""}>
    <span>${f.months} months · ${inr(f.pay)}</span></label>`).join("");
  $$("#monthOpts input").forEach(i=>i.addEventListener("change",()=>{ months=Number(i.value); quote(); }));
  if(!pl.fees.some(f=>f.months===months)){ months = pl.fees[1].months; renderMonths(); }
}
function quote(){
  const pl = PLAN[$("#planSel").value], f = pl.fees.find(x=>x.months===months);
  if(!f){ $("#quoteBox").innerHTML=""; return; }
  const inc = pl.perMonth*f.months;
  $("#quoteBox").innerHTML = `<div class="quote"><table>
    <tr><th>${esc(pl.name)} · ${f.months} months</th><td>${inc} sessions included</td></tr>
    <tr><th>Actual fee</th><td class="was">${inr(f.list)}</td></tr>
    <tr><th>Discount</th><td><span class="off">${f.disc}% off</span> &minus;${inr(f.list-f.pay)}</td></tr>
    <tr class="tot"><th>You pay</th><td>${inr(f.pay)}</td></tr>
    <tr><th>Works out to</th><td>${inr(f.pay/inc)} a session</td></tr>
  </table>
  <div style="font-size:.83rem;color:var(--ink-soft);margin-top:9px">The assessment fee you have already paid is
  set off against this. Fees are settled at the centre, not on this site.</div></div>`;
}
function nextOpenDay(){
  const d = new Date(); d.setDate(d.getDate()+1);
  for(let i=0;i<14;i++){ if(CONFIG.openDays.includes(d.getDay())) return d; d.setDate(d.getDate()+1); }
  return d;
}
function checkDay(e){
  const v = e.target.value; if(!v) return;
  const day = new Date(v+"T00:00:00").getDay();
  const box = e.target.parentElement.querySelector(".err") || $("#f_date").parentElement.querySelector(".err");
  if(!CONFIG.openDays.includes(day)){
    toast("We are closed on "+DAYNAMES[day]+". Please pick another day.","bad");
    e.target.value = iso(nextOpenDay());
  }
}
function safetyMsg(){
  const hard = $$("#safetyBox input:checked").filter(i=>i.dataset.hard==="1");
  const soft = $$("#safetyBox input:checked").filter(i=>i.dataset.hard==="0" && i.value!=="none");
  let h = "";
  if(hard.length) h = `<div class="note bad" style="margin-top:12px"><b>Please read this before you book</b>
    What you have ticked rules out one or more of our instruments — a pacemaker or implanted device, pregnancy,
    an active cancer, a clot, epilepsy or a very recent fracture are absolute exclusions for electrical and
    magnetic therapy. You are still welcome to book the free consultation, and the doctor will tell you
    honestly what is and is not open to you.</div>`;
  else if(soft.length) h = `<div class="note warn" style="margin-top:12px"><b>The doctor will check this with you</b>
    None of what you have ticked rules treatment out, but it does need a clinical decision before your first session.</div>`;
  $("#safetyMsg").innerHTML = h;
}

/* ───────────────── validation and message ───────────────── */
function collect(){
  const pl = PLAN[$("#planSel").value], f = pl.fees.find(x=>x.months===months);
  return {
    ref: makeRef(),
    purpose, purposeLabel: PURPOSES.find(p=>p.id===purpose).label,
    plan: purpose==="plan" ? {id:pl.id, name:pl.name, sub:pl.sub, months, list:f.list, disc:f.disc, pay:f.pay,
      sessions: pl.perMonth*f.months} : null,
    name:$("#f_name").value.trim(), phone:$("#f_phone").value.trim(), age:$("#f_age").value,
    sex:$("#f_sex").value, city:$("#f_city").value.trim(), heard:$("#f_heard").value,
    complaint:$("#f_complaint").value.trim(),
    regions:$$('input[name="region"]:checked').map(i=>i.value),
    safety:$$("#safetyBox input:checked").map(i=>({id:i.value, hard:i.dataset.hard==="1",
      q:SAFETY.find(s=>s.id===i.value).q})),
    date:$("#f_date").value, date2:$("#f_date2").value, slot,
    notes:$("#f_notes").value.trim(), createdAt:new Date().toISOString()
  };
}
function validate(b){
  const e = {};
  if(!/^[A-Za-z\u0900-\u097F\u0C00-\u0C7F .'-]{3,60}$/.test(b.name)) e.f_name = "Please enter your full name.";
  if(!/^[6-9]\d{9}$/.test(b.phone)) e.f_phone = "A 10-digit Indian mobile number starting 6, 7, 8 or 9.";
  const age = Number(b.age);
  if(!age || age<5 || age>105) e.f_age = "Age between 5 and 105.";
  if(!b.sex) e.f_sex = "Please choose one.";
  if(b.city.length<2) e.f_city = "Which town or city are you coming from?";
  if(b.complaint.length<8) e.f_complaint = "A sentence is enough — what is troubling you, and for how long.";
  if(!b.date) e.f_date = "Pick a preferred date.";
  if(!b.slot) e.slot = "Pick a time that suits you.";
  if(!b.safety.length) e.safety = "Please answer the safety check — tick the last box if none apply.";
  if(!$("#f_consent").checked) e.consent = "Please tick this to continue.";
  return e;
}
function showErrors(e){
  $$(".err").forEach(n=>{ n.classList.add("hide"); n.textContent=""; });
  for(const k in e){
    let box;
    if(k==="slot") box = $("#e_slot");
    else if(k==="consent") box = $("#e_consent");
    else if(k==="safety") box = $("#safetyMsg");
    else { const el=$("#"+k); box = el && el.parentElement.querySelector(".err"); }
    if(!box) continue;
    if(k==="safety"){ box.innerHTML = `<div class="note bad" style="margin-top:12px">${esc(e[k])}</div>`; continue; }
    box.textContent = e[k]; box.classList.remove("hide");
  }
  const first = $(".err:not(.hide)");
  if(first && first.scrollIntoView) first.scrollIntoView({block:"center", behavior:"smooth"});
}
function makeRef(){
  const d = new Date();
  const ymd = String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  return "PSR-"+ymd+"-"+Math.floor(1000+Math.random()*9000);
}
function buildMessage(b){
  const L = [];
  L.push("*NEW APPOINTMENT REQUEST — "+CONFIG.centre.short+"*");
  L.push("Ref: "+b.ref);
  L.push("");
  L.push("*Wants:* "+b.purposeLabel);
  if(b.plan){
    L.push("*Programme:* "+b.plan.name+" — "+b.plan.sub);
    L.push("*Duration:* "+b.plan.months+" months, "+b.plan.sessions+" sessions included");
    L.push("*Fee quoted:* "+inr(b.plan.list)+" less "+b.plan.disc+"% = "+inr(b.plan.pay));
  }
  L.push("");
  L.push("*Patient:* "+b.name+", "+b.age+" "+(b.sex||"").charAt(0));
  L.push("*Mobile:* "+b.phone);
  L.push("*From:* "+b.city);
  L.push("");
  L.push("*Preferred:* "+fmtDate(b.date)+", "+b.slot);
  if(b.date2) L.push("*Alternate:* "+fmtDate(b.date2));
  L.push("");
  L.push("*Concern:* "+b.complaint);
  if(b.regions.length) L.push("*Areas:* "+b.regions.join(", "));
  const hard = b.safety.filter(s=>s.hard), soft = b.safety.filter(s=>!s.hard && s.id!=="none");
  if(hard.length) L.push("*⚠ SAFETY — EXCLUSIONS:* "+hard.map(s=>s.q).join("; "));
  if(soft.length) L.push("*Safety — check:* "+soft.map(s=>s.q).join("; "));
  if(!hard.length && !soft.length) L.push("*Safety:* nothing declared");
  if(b.notes) L.push("*Notes:* "+b.notes);
  L.push("*Heard about us:* "+b.heard);
  L.push("");
  L.push("_Sent from the "+CONFIG.centre.short+" booking site._");
  return L.join("\n");
}
const waLink = (number, text) => "https://wa.me/"+number+"?text="+encodeURIComponent(text);

/* ───────────────── local record of this device's bookings ───────────────── */
const STORE = "psriem.bookings";
function saved(){ try{ return JSON.parse(localStorage.getItem(STORE)||"[]"); }catch(e){ return []; } }
function store(b){
  try{ const l = saved(); l.unshift(b); localStorage.setItem(STORE, JSON.stringify(l.slice(0,20))); }catch(e){}
}
function paintSaved(){
  const l = saved();
  if(!l.length){ $("#myBookings").innerHTML=""; return; }
  $("#myBookings").innerHTML = `<div class="card"><h3>Requests you have sent from this device</h3>
    <p style="font-size:.88rem;color:var(--ink-soft)">Kept on this phone or computer only. If WhatsApp did not
    open, or you closed it before sending, you can send the same request again.</p>
    ${l.map(b=>`<div style="padding:12px 0;border-bottom:1px solid var(--paper-2)">
      <div class="spread" style="align-items:center">
        <div><span class="ref">${esc(b.ref)}</span>
          <div style="font-size:.86rem;color:var(--ink-soft)">${esc(b.purposeLabel)}${b.plan?` · ${esc(b.plan.name)} ${b.plan.months} mo`:""}
          · ${fmtDate(b.date)}, ${esc(b.slot)}</div></div>
        <div class="row" style="gap:8px">
          <button class="btn sm wa" data-resend="${esc(b.ref)}">Send again</button>
          <button class="btn sm line" data-ics="${esc(b.ref)}">Add to calendar</button></div></div></div>`).join("")}
    <div class="row" style="margin-top:14px"><button class="btn sm line" id="clearSaved">Clear this list</button></div></div>`;
  $$("[data-resend]").forEach(x=>x.addEventListener("click",()=>{
    const b = saved().find(y=>y.ref===x.dataset.resend);
    window.open(waLink(CONFIG.whatsapp, buildMessage(b)), "_blank");
  }));
  $$("[data-ics]").forEach(x=>x.addEventListener("click",()=>{
    const b = saved().find(y=>y.ref===x.dataset.ics); downloadICS(b);
  }));
  $("#clearSaved").addEventListener("click",()=>{
    localStorage.removeItem(STORE); paintSaved(); toast("List cleared");
  });
}
function to24(slotStr){
  const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(slotStr);
  if(!m) return [9,0];
  let h = Number(m[1]) % 12; if(/pm/i.test(m[3])) h += 12;
  return [h, Number(m[2])];
}
function downloadICS(b){
  const [h,mi] = to24(b.slot);
  const start = new Date(b.date+"T00:00:00"); start.setHours(h,mi,0,0);
  const end = new Date(start.getTime()+45*60000);
  const z = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")
    +"T"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"00";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PSRIEM//Booking//EN","BEGIN:VEVENT",
    "UID:"+b.ref+"@psriem","DTSTAMP:"+z(new Date()),"DTSTART:"+z(start),"DTEND:"+z(end),
    "SUMMARY:"+CONFIG.centre.short+" — "+b.purposeLabel,
    "LOCATION:"+CONFIG.centre.address.replace(/,/g,"\\,"),
    "DESCRIPTION:Ref "+b.ref+"\\nRequested slot — please wait for the clinic's confirmation on WhatsApp.\\n"
      +CONFIG.phoneDisplay,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  let revoke = null;
  try{ a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); revoke = a.href; }
  catch(err){ a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics); }
  a.download = b.ref+".ics"; document.body.appendChild(a); a.click(); a.remove();
  if(revoke) setTimeout(()=>URL.revokeObjectURL(revoke), 3000);
}

/* ───────────────── submit ───────────────── */
function bindForm(){
  $("#previewBtn").addEventListener("click", ()=>{
    const b = collect(), e = validate(b);
    if(Object.keys(e).length){ showErrors(e); toast("A few things still need filling in","bad"); return; }
    showErrors({});
    modal("This is what the clinic will receive", b.ref,
      `<pre class="msg">${esc(buildMessage(b))}</pre>
       <div class="note"><b>Nothing has been sent yet</b>Close this and press the green button to open WhatsApp.</div>
       <div class="row" style="margin-top:16px"><button class="btn line" data-close>Close</button></div>`);
    $$("[data-close]").forEach(n=>n.addEventListener("click", closeModal));
  });

  $("#bookForm").addEventListener("submit", e=>{
    e.preventDefault();
    const b = collect(), errs = validate(b);
    if(Object.keys(errs).length){ showErrors(errs); toast("A few things still need filling in","bad"); return; }
    showErrors({});
    const text = buildMessage(b);
    const link = waLink(CONFIG.whatsapp, text);
    store(b); paintSaved();
    const win = window.open(link, "_blank");
    const hard = b.safety.filter(s=>s.hard);
    modal("Your request is ready", b.ref, `
      <div class="note good"><b>WhatsApp should have opened</b>Press send there, and the clinic has your request.
      If nothing opened, use the button below.</div>
      ${hard.length?`<div class="note bad" style="margin-top:12px"><b>Flagged for the doctor</b>
        You told us about: ${esc(hard.map(s=>s.q).join("; "))}. This is marked clearly in the message so the
        doctor sees it before scheduling anything.</div>`:""}
      <div class="quote" style="margin-top:16px"><table>
        <tr><th>Reference</th><td class="ref">${esc(b.ref)}</td></tr>
        <tr><th>For</th><td>${esc(b.purposeLabel)}</td></tr>
        ${b.plan?`<tr><th>Programme</th><td>${esc(b.plan.name)} · ${b.plan.months} months · ${inr(b.plan.pay)}</td></tr>`:""}
        <tr><th>Requested</th><td>${fmtDate(b.date)}, ${esc(b.slot)}</td></tr>
      </table></div>
      <p style="font-size:.9rem">Keep this reference. The clinic replies on WhatsApp to confirm the exact time —
      usually the same day, and by the next working morning at the latest.</p>
      <div class="row" style="margin-top:8px">
        <a class="btn wa" href="${link}" target="_blank" rel="noopener">Open WhatsApp again</a>
        <button class="btn line" id="mIcs">Add to calendar</button>
        <button class="btn line" data-close>Done</button></div>`);
    $("#mIcs").addEventListener("click", ()=>downloadICS(b));
    $$("[data-close]").forEach(n=>n.addEventListener("click", closeModal));
    if(!win) toast("Your browser blocked the pop-up — use the WhatsApp button in the box","bad");
  });

  $("#shareWa").addEventListener("click", ()=>{
    const msg = `${CONFIG.centre.name}\n${CONFIG.centre.parent}\n\nHeal deeper. Recover faster. Live better.\n`
      + `Book a free consultation, an assessment or a membership programme here:\n${location.href.split("#")[0]}\n\n`
      + `Appointments: ${CONFIG.phoneDisplay}`;
    window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank");
  });
  $("#copyLink").addEventListener("click", async ()=>{
    const url = location.href.split("#")[0];
    try{ await navigator.clipboard.writeText(url); toast("Link copied","good"); }
    catch(e){ modal("Share this link","", `<pre class="msg">${esc(url)}</pre>`); }
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   STAFF BOOKING DESK  —  open with #desk
   Composes the confirmation, reschedule or decline reply and sends it
   straight to the patient's WhatsApp. Everything stays on this device.
   ═══════════════════════════════════════════════════════════════════════ */
function desk(){
  const ok = sessionStorage.getItem("psriem.desk")==="1";
  if(!ok){
    modal("Booking desk", "Staff only", `
      <div class="field"><label for="pin">PIN</label><input id="pin" type="password" autocomplete="off"></div>
      <div class="err hide" id="pinErr"></div>
      <button class="btn" id="pinGo">Open the desk</button>
      <div class="note warn" style="margin-top:16px"><b>This PIN is not security</b>
        Anyone can read it in this page's source. It only stops a patient wandering in by accident.
        Keep patient records in the clinic portal on your own machine.</div>`);
    $("#pinGo").addEventListener("click", ()=>{
      if($("#pin").value.trim()===CONFIG.deskPin){ sessionStorage.setItem("psriem.desk","1"); closeModal(); desk(); }
      else { $("#pinErr").textContent = "That PIN is not right."; $("#pinErr").classList.remove("hide"); }
    });
    $("#pin").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#pinGo").click(); });
    return;
  }
  const slots = CONFIG.slots.map(s=>`<option>${esc(s)}</option>`).join("");
  modal("Booking desk", "Reply to a request", `
    <div class="grid g2" style="gap:0 18px">
      <div class="field"><label for="d_phone">Patient's WhatsApp number</label>
        <input id="d_phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digits"></div>
      <div class="field"><label for="d_name">Patient's name</label><input id="d_name" type="text"></div>
      <div class="field"><label for="d_ref">Booking reference</label><input id="d_ref" type="text" placeholder="PSR-260905-4821"></div>
      <div class="field"><label for="d_action">Reply</label><select id="d_action">
        <option value="confirm">Confirm the appointment</option>
        <option value="reschedule">Offer a different time</option>
        <option value="info">Ask for more information</option>
        <option value="decline">Cannot treat — advise a consultation first</option></select></div>
    </div>
    <div id="d_when"><div class="grid g2" style="gap:0 18px">
      <div class="field"><label for="d_date">Date</label><input id="d_date" type="date" value="${iso(nextOpenDay())}"></div>
      <div class="field"><label for="d_slot">Time</label><select id="d_slot">${slots}</select></div></div></div>
    <div class="field"><label for="d_with">Seeing</label>
      <input id="d_with" type="text" placeholder="Duty physician, or a name"></div>
    <div class="field"><label for="d_extra">Anything to add</label>
      <textarea id="d_extra" placeholder="Bring your scans · fees payable at the centre · arrive 10 minutes early"></textarea></div>
    <div id="d_preview"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn wa" id="d_send">Send this reply on WhatsApp</button>
      <button class="btn line" id="d_copy">Copy the message</button>
      <button class="btn line" id="d_out">Sign out of the desk</button></div>`);

  const build = () => {
    const name = $("#d_name").value.trim() || "there";
    const ref = $("#d_ref").value.trim();
    const act = $("#d_action").value;
    const when = fmtDate($("#d_date").value) + " at " + $("#d_slot").value;
    const withWho = $("#d_with").value.trim();
    const extra = $("#d_extra").value.trim();
    const L = ["*"+CONFIG.centre.short+" — "+CONFIG.centre.name+"*"];
    if(ref) L.push("Ref: "+ref);
    L.push("");
    L.push("Dear "+name+",");
    if(act==="confirm"){
      L.push("Your appointment is *confirmed* for *"+when+"*"+(withWho?" with "+withWho:"")+".");
      L.push("");
      L.push("Please come to "+CONFIG.centre.address+" about 10 minutes early.");
      L.push("Bring any recent scans, reports and your current medicines.");
      L.push("Wear loose, comfortable clothing.");
    } else if(act==="reschedule"){
      L.push("Thank you for your request. The slot you asked for is taken.");
      L.push("Can you come on *"+when+"* instead"+(withWho?" — you would be seeing "+withWho:"")+"?");
      L.push("");
      L.push("Reply yes and we will hold it for you.");
    } else if(act==="info"){
      L.push("Thank you for your request. Before we fix a time, could you tell us a little more?");
      L.push("");
      L.push("It helps to know how long the problem has been going on, any treatment you have already had, and any scans or reports you hold.");
    } else {
      L.push("Thank you for reaching out.");
      L.push("From what you have told us, some of our instruments would not be safe for you, so we would rather see you for a *consultation first* before deciding anything.");
      L.push("");
      L.push("Can you come on *"+when+"*? There is no charge for the consultation.");
    }
    if(extra){ L.push(""); L.push(extra); }
    L.push("");
    L.push(CONFIG.phoneDisplay);
    L.push("_Heal deeper. Recover faster. Live better._");
    return L.join("\n");
  };
  const refresh = () => {
    $("#d_when").classList.toggle("hide", $("#d_action").value==="info");
    $("#d_preview").innerHTML = `<pre class="msg">${esc(build())}</pre>`;
  };
  ["d_name","d_ref","d_date","d_slot","d_with","d_extra","d_action"].forEach(id=>{
    $("#"+id).addEventListener("input", refresh); $("#"+id).addEventListener("change", refresh);
  });
  $("#d_phone").addEventListener("input", e=>{ e.target.value = e.target.value.replace(/\D/g,"").slice(0,10); });
  refresh();
  $("#d_send").addEventListener("click", ()=>{
    const ph = $("#d_phone").value.trim();
    if(!/^[6-9]\d{9}$/.test(ph)){ toast("Enter the patient's 10-digit number","bad"); return; }
    window.open(waLink("91"+ph, build()), "_blank");
  });
  $("#d_copy").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(build()); toast("Message copied","good"); }
    catch(e){ toast("Select the text above and copy it","bad"); }
  });
  $("#d_out").addEventListener("click", ()=>{ sessionStorage.removeItem("psriem.desk"); closeModal(); toast("Signed out of the desk"); });
}

/* ───────────────── mounted by the shell ───────────────── */
function mount(){
  if(!document.getElementById("bookForm")) return;
  paintStatic(); paintForm(); bindForm(); paintSaved(); setPurpose("consult");
  const dl2 = document.getElementById("deskLink");
  if(dl2) dl2.addEventListener("click", e=>{ e.preventDefault(); desk(); });
}
window.PUBLIC = {mount, desk, plans:()=>PLANS, config:()=>CONFIG, therapies:()=>THERAPIES};

})();
</script>
<script>
(function(){
"use strict";

"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   PSRIEM — Comprehensive Integrative Health Assessment
   Single file. Everything is stored in this browser's localStorage.
   Schema below mirrors the institute's printed 23-section form exactly.
   ══════════════════════════════════════════════════════════════════════════ */

/* field helpers — keeps the schema readable */
const T = (k,l,o={}) => ({k,l,t:"text",...o});

/* which anatomical region does a point fall in? keeps the data analysable */
function regionAt(x, y, view){
  const patientSide = view==="front" ? (x<100 ? "Right":"Left") : (x<100 ? "Left":"Right");
  const S = n => `${patientSide} ${n}`;
  const limb = (x < 62 || x > 138);
  if(y < 26) return "Head — scalp / crown";
  if(y < 58) return view==="front" ? "Face" : "Occiput / back of head";
  if(y < 70) return view==="front" ? "Anterior neck / throat" : "Cervical spine / neck";
  if(limb){
    if(y < 78) return S("shoulder");
    if(y < 148) return S("upper arm");
    if(y < 158) return S("elbow");
    if(y < 205) return S("forearm");
    if(y < 218) return S("wrist");
    return S("hand");
  }
  if(y < 92 && (x < 82 || x > 118)) return S("shoulder");
  if(y < 105) return view==="front" ? "Chest" : "Upper back / thoracic";
  if(y < 150) return view==="front" ? "Abdomen" : "Mid back";
  if(y < 172) return view==="front" ? "Lower abdomen" : "Lower back / lumbar";
  if(y < 196) return view==="front" ? S("hip / groin") : S("sacrum / buttock");
  if(y < 268) return view==="front" ? S("thigh — anterior") : S("thigh — posterior");
  if(y < 300) return view==="front" ? S("knee") : S("knee — popliteal");
  if(y < 372) return view==="front" ? S("shin") : S("calf");
  if(y < 392) return S("ankle");
  return S("foot");
}

/* ── render marks onto a map ── */
function drawMarks(svg, view){
  const g = svg.querySelector(".marks");
  const list = REC.marks.filter(m=>m.view===view);
  g.innerHTML = list.map(m=>{
    const t = MARK[m.type], sel = m.id===selMark;
    return `<g class="mark-hit" data-markid="${m.id}">
      <circle cx="${m.x}" cy="${m.y}" r="11" fill="${t.colour}" opacity="${sel?0.22:0.12}"/>
      ${sel?`<circle class="mark-sel" cx="${m.x}" cy="${m.y}" r="13"/>`:""}
      <text x="${m.x}" y="${m.y}" text-anchor="middle" dominant-baseline="central"
        font-size="15" font-weight="700" fill="${t.colour}" style="pointer-events:none">${t.sym}</text>
      ${m.sev?`<text x="${m.x+11}" y="${m.y-9}" font-size="9" font-weight="700" fill="${t.colour}"
        style="pointer-events:none">${m.sev}</text>`:""}
    </g>`;
  }).join("");
}
function svgPoint(svg, evt){
  if(svg.createSVGPoint && svg.getScreenCTM){
    const p = svg.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
    const ctm = svg.getScreenCTM();
    if(ctm){ const q = p.matrixTransform(ctm.inverse()); return {x:+q.x.toFixed(1), y:+q.y.toFixed(1)}; }
  }
  const r = svg.getBoundingClientRect();
  return {x:+(((evt.clientX-r.left)/r.width)*200).toFixed(1), y:+(((evt.clientY-r.top)/r.height)*460).toFixed(1)};
}
let curTool = "pain", selMark = null;
function bindMap(svg){
  const view = svg.dataset.view;
  svg.addEventListener("pointerdown", e=>{
    const hit = e.target.closest("[data-markid]");
    if(hit){ selMark = hit.dataset.markid; paintMapPanel(); return; }
    const p = svgPoint(svg, e);
    if(p.x<8||p.x>192||p.y<4||p.y>456) return;
    const m = {id:"m"+Math.random().toString(36).slice(2,8), view, x:p.x, y:p.y, type:curTool,
      region:regionAt(p.x,p.y,view), sev:0, note:"", ts:new Date().toISOString()};
    REC.marks.push(m); selMark = m.id; touch(); paintMapPanel();
  });
}
function bodyMapBlock(){
  return `<div class="mapwrap">
    <div>
      <div class="maps">
        <div class="mapcard"><h4>FRONT</h4>${bodySVG("front")}</div>
        <div class="mapcard"><h4>BACK</h4>${bodySVG("back")}</div>
      </div>
      <div class="legend">${MARKS.map(m=>`<span><b style="color:${m.colour};font-size:1rem">${m.sym}</b>
        ${m.label}</span>`).join("")}</div>
      <div class="note" style="margin-top:12px"><b>How to use it</b>Pick a symbol, then tap the body where the
      client points. Tap a mark again to set its severity or add a note. Every mark stores the anatomical
      region it landed in, so the record can be searched and counted later.</div>
    </div>
    <div class="tools">
      <h4>Marking</h4>
      ${MARKS.map(m=>`<button type="button" class="tool ${m.id===curTool?"on":""}" data-tool="${m.id}">
        <span class="sym" style="color:${m.colour}">${m.sym}</span>${m.label}</button>`).join("")}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button type="button" class="btn line sm" id="undoMark">Undo last</button>
        <button type="button" class="btn line sm" id="clearMarks">Clear all</button>
      </div>
      <h4 style="margin-top:16px">Marks placed <span class="pill info">${REC.marks.length}</span></h4>
      <div class="marklist" id="marklist">${markListHTML()}</div>
    </div>
  </div>`;
}
function markListHTML(){
  if(!REC.marks.length) return `<p style="font-size:.83rem;color:var(--ink-soft)">Nothing marked yet.</p>`;
  return REC.marks.map(m=>{
    const t = MARK[m.type], sel = m.id===selMark;
    return `<div class="mk ${sel?"on":""}" data-mk="${m.id}">
      <div class="r"><span><b style="color:${t.colour}">${t.sym}</b> ${t.label}</span>
        <span class="sev" style="color:${t.colour}">${m.sev||"–"}</span></div>
      <div style="color:var(--ink-soft);font-size:.78rem">${esc(m.region)} · ${m.view}</div>
      ${sel?`<input type="range" min="0" max="10" value="${m.sev}" data-sev="${m.id}">
        <input type="text" placeholder="Note — e.g. worse on stairs" value="${esc(m.note)}" data-note="${m.id}">
        <button type="button" class="btn danger sm" data-del="${m.id}" style="margin-top:6px">Remove this mark</button>`:""}
    </div>`;
  }).join("");
}
function paintMapBlock(){
  const host = document.querySelector("[data-block='bodymap']");
  if(!host) return;
  host.innerHTML = bodyMapBlock();
  host.querySelectorAll("svg[data-view]").forEach(svg=>{ bindMap(svg); drawMarks(svg, svg.dataset.view); });
  host.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>{
    curTool = b.dataset.tool; paintMapPanel();
  }));
  host.querySelector("#undoMark").addEventListener("click",()=>{
    if(!REC.marks.length){ toast("Nothing to undo"); return; }
    REC.marks.pop(); selMark=null; touch(); paintMapPanel();
  });
  host.querySelector("#clearMarks").addEventListener("click",()=>{
    if(!REC.marks.length) return;
    if(!confirm("Remove every mark from both body maps?")) return;
    REC.marks = []; selMark=null; touch(); paintMapPanel();
  });
  bindMarkList(host);
}
function paintMapPanel(){
  const host = document.querySelector("[data-block='bodymap']");
  if(!host) return;
  host.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("on", b.dataset.tool===curTool));
  host.querySelectorAll("svg[data-view]").forEach(svg=>drawMarks(svg, svg.dataset.view));
  const ml = host.querySelector("#marklist");
  if(ml){ ml.innerHTML = markListHTML(); bindMarkList(host); }
  const cnt = host.querySelector(".pill.info"); if(cnt) cnt.textContent = REC.marks.length;
}
function bindMarkList(host){
  host.querySelectorAll("[data-mk]").forEach(el=>el.addEventListener("click", e=>{
    if(e.target.closest("input,button")) return;
    selMark = selMark===el.dataset.mk ? null : el.dataset.mk; paintMapPanel();
  }));
  host.querySelectorAll("[data-sev]").forEach(el=>el.addEventListener("input", e=>{
    const m = REC.marks.find(x=>x.id===el.dataset.sev); m.sev = Number(e.target.value);
    el.closest(".mk").querySelector(".sev").textContent = m.sev||"–";
    host.querySelectorAll("svg[data-view]").forEach(s=>drawMarks(s,s.dataset.view)); touch();
  }));
  host.querySelectorAll("[data-note]").forEach(el=>el.addEventListener("input", e=>{
    REC.marks.find(x=>x.id===el.dataset.note).note = e.target.value; touch();
  }));
  host.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click", e=>{
    e.stopPropagation();
    REC.marks = REC.marks.filter(x=>x.id!==el.dataset.del); selMark=null; touch(); paintMapPanel();
  }));
}
/* a plain-language summary of the map, used in exports and the record list */
function mapSummary(){
  if(!REC.marks.length) return "";
  const by = {};
  for(const m of REC.marks){ const k = MARK[m.type].label; (by[k]=by[k]||[]).push(m); }
  return Object.entries(by).map(([label,list])=>{
    const regions = [...new Set(list.map(m=>m.region))];
    const sev = list.filter(m=>m.sev).map(m=>m.sev);
    const peak = sev.length ? ` (worst ${Math.max(...sev)}/10)` : "";
    return `${label}: ${regions.join(", ")}${peak}`;
  }).join(" · ");
}

const KEY = "psriem.assessments.v1";
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtDT = s => s ? new Date(s).toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";

let DB = {records:[]}, REC = null, curSec = "cover", dirty = false, saveTimer = null;

let ROOT = null, HOST = null, CUR_PATIENT = null;
function load(){ DB = {records: HOST.clinical()}; }
function persist(){ HOST.save(); dirty = false; paintSaveDot(); }
function touch(){
  if(!REC) return;
  REC.updated = new Date().toISOString();
  dirty = true; paintSaveDot();
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 500);
}
function paintSaveDot(){
  const el = $("#savedot"); if(!el) return;
  el.className = "savedot" + (dirty?" dirty":"");
  el.innerHTML = `<i></i>${dirty?"Saving…":"Saved"} ${REC?"· "+fmtDT(REC.updated):""}`;
}
function nextClientId(){
  const y = new Date().getFullYear();
  const n = DB.records.filter(r=>(r.d.clientId||"").includes("-"+y+"-")).length + 1;
  return `PSR-${y}-${String(n).padStart(4,"0")}`;
}
function newRecord(seed){
  const r = {id:"r"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3),
    created:new Date().toISOString(), updated:new Date().toISOString(), marks:[], d:{}};
  if(seed){
    /* carry the profile forward for a reassessment, leave findings blank */
    const carry = ["clientId","clientName","practitioner","programme","fullName","age","dob","sex","phone",
      "occupation","workDemands","address","referral","height"];
    carry.forEach(k=>{ if(seed.d[k]!==undefined) r.d[k]=seed.d[k]; });
    r.d.stage = "4–6 week review";
  }else{
    r.d.clientId = nextClientId();
  }
  r.d.assessDate = today();
  r.patientId = (seed && seed.patientId) || CUR_PATIENT || null;
  if(HOST.seed) HOST.seed(r);
  DB.records.unshift(r); REC = r; persist(); return r;
}
const get = k => (REC && REC.d[k]!==undefined) ? REC.d[k] : "";
function set(k,v){ REC.d[k] = v; touch(); }

/* keys owned by each section — used for the completion ticks and exports */
function keysOf(sec){
  const out = [];
  for(const b of sec.blocks){
    if(b.t==="grid") b.f.forEach(f=>out.push(f.k));
    else if(b.t==="table") b.rows.forEach((_,r)=>b.cols.slice(1).forEach((_,c)=>out.push(`${b.id}.${r}.${c}`)));
    else if(b.t==="checks") b.items.forEach((_,i)=>out.push(`${b.id}.${i}`));
    else if(b.t==="ynTable") b.rows.forEach((_,r)=>{ out.push(`${b.id}.${r}.ans`); out.push(`${b.id}.${r}.detail`); });
    else if(b.t==="modality") MODALITIES.forEach((_,i)=>["ind","suit","prec"].forEach(s=>out.push(`modality.${i}.${s}`)));
    else if(b.t==="painSeverity") ["painNow","painBest","painWorst","painAvg"].forEach(k=>out.push(k));
  }
  return out;
}
function secFilled(sec){
  if(sec.id==="s3") return REC.marks.length>0 || keysOf(sec).some(k=>notEmpty(REC.d[k]));
  return keysOf(sec).some(k=>notEmpty(REC.d[k]));
}
const notEmpty = v => v!==undefined && v!=="" && v!==false && !(Array.isArray(v)&&!v.length);

function field(f){
  const v = get(f.k), id = "fld_"+f.k.replace(/\W/g,"_");
  const lab = `<label for="${id}">${esc(f.l)}${f.req?' <span style="color:var(--alert)">*</span>':''}</label>`;
  let inp = "";
  if(f.t==="text"||f.t==="num"||f.t==="date"){
    const type = f.t==="num"?"number":f.t==="date"?"date":"text";
    inp = `<input id="${id}" type="${type}" data-k="${f.k}" value="${esc(v)}"
      ${f.ro?"readonly":""} ${f.step?`step="${f.step}"`:""} ${f.ph?`placeholder="${esc(f.ph)}"`:""}>`;
  }
  else if(f.t==="area") inp = `<textarea id="${id}" data-k="${f.k}" class="${f.tall?"tall":""}"
      ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${esc(v)}</textarea>`;
  else if(f.t==="sel") inp = `<select id="${id}" data-k="${f.k}">${f.o.map(o=>
      `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="radio") inp = `<div class="opts">${f.o.map(o=>`<label class="opt">
      <input type="radio" name="${f.k}" data-k="${f.k}" value="${esc(o)}" ${o===v?"checked":""}>
      <span>${esc(o)}</span></label>`).join("")}</div>`;
  else if(f.t==="multi"){ const arr = Array.isArray(v)?v:[];
    inp = `<div class="opts">${f.o.map(o=>`<label class="opt">
      <input type="checkbox" data-multi="${f.k}" value="${esc(o)}" ${arr.includes(o)?"checked":""}>
      <span>${esc(o)}</span></label>`).join("")}</div>`; }
  else if(f.t==="vas"){ const n = v===""?0:Number(v);
    inp = `<div class="vas"><input type="range" min="0" max="10" step="1" data-k="${f.k}" value="${n}"
      oninput="this.nextElementSibling.value=this.value"><output>${n}</output></div>`; }
  return `<div class="f">${lab}${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}
function blockHTML(b){
  if(b.t==="grid") return `<div class="block">${b.h?`<h3>${esc(b.h)}</h3>`:""}
    <div class="grid c${b.c}">${b.f.map(field).join("")}</div></div>`;
  if(b.t==="note") return `<div class="note ${b.kind||""}"><b>${esc(b.b)}</b>${esc(b.text)}</div>`;
  if(b.t==="checks") return `<div class="block">${b.h?`<h3>${esc(b.h)}</h3>`:""}
    <div class="checks">${b.items.map((it,i)=>`<div class="ck">
      <input type="checkbox" id="ck_${b.id}_${i}" data-k="${b.id}.${i}" ${get(`${b.id}.${i}`)?"checked":""}>
      <label for="ck_${b.id}_${i}">${esc(it)}</label></div>`).join("")}</div></div>`;
  if(b.t==="table"){
    return `<div class="block"><div class="tw"><table class="f-tbl">
      <thead><tr>${b.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${b.rows.map((row,r)=>`<tr><td>${esc(row)}</td>
        ${b.cols.slice(1).map((_,c)=>`<td><input type="text" data-k="${b.id}.${r}.${c}"
          value="${esc(get(`${b.id}.${r}.${c}`))}"></td>`).join("")}</tr>`).join("")}
      </tbody></table></div></div>`;
  }
  if(b.t==="ynTable"){
    return `<div class="block"><div class="tw"><table class="f-tbl">
      <thead><tr><th>Question / condition</th><th class="yn-cell">No</th><th class="yn-cell">Yes</th>
        <th>Details / precautions</th></tr></thead>
      <tbody>${b.rows.map((row,r)=>{
        const v = get(`${b.id}.${r}.ans`), hard = HARD_ROWS.includes(r);
        return `<tr><td style="${hard?"color:var(--alert)":""}">${esc(row)}${hard?' <span title="Absolute exclusion for one or more device therapies">⚠</span>':""}</td>
        <td class="yn-cell n"><input type="radio" name="${b.id}_${r}" data-k="${b.id}.${r}.ans" value="No" ${v==="No"?"checked":""}></td>
        <td class="yn-cell"><input type="radio" name="${b.id}_${r}" data-k="${b.id}.${r}.ans" value="Yes" ${v==="Yes"?"checked":""}></td>
        <td><input type="text" data-k="${b.id}.${r}.detail" value="${esc(get(`${b.id}.${r}.detail`))}"></td></tr>`;
      }).join("")}</tbody></table></div></div>`;
  }
  if(b.t==="safetySummary") return `<div id="safetySummary"></div>`;
  if(b.t==="modality"){
    return `<div class="block"><div class="tw"><table class="f-tbl">
      <thead><tr><th>Modality</th><th>Indication / goal</th><th>Suitability</th><th>Precautions / modifications</th></tr></thead>
      <tbody>${MODALITIES.map((m,i)=>`<tr><td>${esc(m)}</td>
        <td><input type="text" data-k="modality.${i}.ind" value="${esc(get(`modality.${i}.ind`))}"></td>
        <td><select data-k="modality.${i}.suit">${SUIT.map(s=>
          `<option ${s===get(`modality.${i}.suit`)?"selected":""}>${esc(s)}</option>`).join("")}</select></td>
        <td><input type="text" data-k="modality.${i}.prec" value="${esc(get(`modality.${i}.prec`))}"></td></tr>`).join("")}
      </tbody></table></div>
      <div id="modalityHint" style="margin-top:12px"></div></div>`;
  }
  if(b.t==="painSeverity"){
    const rows = [["painNow","Current pain"],["painBest","Best pain"],["painWorst","Worst pain"],["painAvg","Average pain"]];
    return `<div class="block"><h3>Pain severity</h3>
      <p style="font-size:.85rem;color:var(--ink-soft)">0 = no pain, 10 = worst imaginable pain.</p>
      <div class="grid c2">${rows.map(r=>field({k:r[0],l:r[1]+" (0–10)",t:"vas"})).join("")}</div></div>`;
  }
  if(b.t==="bodymap") return `<div class="block" data-block="bodymap"></div>`;
  if(b.t==="progressChart") return `<div class="block"><h3>Pain trend across this record</h3>
    <div id="progChart"></div></div>`;
  if(b.t==="finish") return `<div class="block"><h3>Finish</h3>
    <p style="font-size:.88rem;color:var(--ink-soft)">Everything is saved as you type. Use these when the record is complete.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" id="btnPrint">Print / save as PDF</button>
      <button class="btn line" id="btnReassess">Start a reassessment from this record</button>
      <button class="btn line" id="btnRecords">Back to all records</button></div></div>`;
  return "";
}

/* live safety read-out */
function safetyPanel(){
  const el = $("#safetySummary"); if(!el) return;
  const yes = SAFETY_ROWS.map((q,i)=>({q,i,v:get(`safety.${i}.ans`),d:get(`safety.${i}.detail`)}))
    .filter(x=>x.v==="Yes");
  const hard = yes.filter(x=>HARD_ROWS.includes(x.i));
  const unanswered = SAFETY_ROWS.filter((_,i)=>!get(`safety.${i}.ans`)).length;
  el.innerHTML = `
    ${unanswered?`<div class="note warn"><b>${unanswered} row${unanswered===1?"":"s"} still unanswered</b>
      A blank row is not the same as a No. Complete the screen before any device therapy is planned.</div>`:""}
    ${hard.length?`<div class="note bad"><b>Absolute exclusions declared</b>
      ${hard.map(x=>esc(x.q)+(x.d?` — ${esc(x.d)}`:"")).join("<br>")}
      <br><br>IFT, Magneto and Pulsatron must not be used. Record the reasoning in section 16 before proceeding
      with anything else.</div>`:""}
    ${yes.length && !hard.length?`<div class="note warn"><b>Precautions declared</b>
      ${yes.map(x=>esc(x.q)).join("; ")}. These need a documented clinical decision, not an assumption.</div>`:""}
    ${!yes.length && !unanswered?`<div class="note good"><b>Screen clear</b>
      Nothing declared across all ${SAFETY_ROWS.length} rows.</div>`:""}`;
}
function modalityHint(){
  const el = $("#modalityHint"); if(!el) return;
  const hard = HARD_ROWS.filter(i=>get(`safety.${i}.ans`)==="Yes").map(i=>SAFETY_ROWS[i]);
  el.innerHTML = hard.length
    ? `<div class="note bad"><b>Carried forward from section 4</b>${esc(hard.join("; "))}.
       Electrical and magnetic modalities must be recorded as <em>Not suitable</em> unless a documented clinical
       decision says otherwise.</div>`
    : `<div class="note good"><b>No absolute exclusions on file</b>Suitability is a clinical judgment for each
       modality; record the reasoning either way.</div>`;
}
function progChart(){
  const el = $("#progChart"); if(!el) return;
  const cols = ["Baseline","4–6 wk","3 mo","6 mo","12 mo"];
  const vals = cols.map((_,c)=>{ const v = parseFloat(get(`progress.0.${c}`)); return isNaN(v)?null:v; });
  if(vals.every(v=>v===null)){
    el.innerHTML = `<p style="font-size:.86rem;color:var(--ink-soft)">Enter the pain score row above and the trend
      is drawn here.</p>`; return;
  }
  const w=520,h=190,pad=34,max=10, step=(w-pad*2)/(cols.length-1);
  const pt=(v,i)=>[pad+i*step, h-pad-(h-pad*2)*(v/max)];
  const pts = vals.map((v,i)=>v===null?null:pt(v,i)).filter(Boolean);
  const d = pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:560px;height:auto">
    ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" y1="${h-pad-(h-pad*2)*f}" x2="${w-pad}" y2="${h-pad-(h-pad*2)*f}"
      stroke="#EFE6D4"/><text x="${pad-8}" y="${h-pad-(h-pad*2)*f+4}" text-anchor="end" font-size="10"
      fill="#8A7B92">${Math.round(max*f)}</text>`).join("")}
    <path d="${d}" fill="none" stroke="#C0261B" stroke-width="2.4"/>
    ${vals.map((v,i)=>v===null?"":`<circle cx="${pt(v,i)[0]}" cy="${pt(v,i)[1]}" r="4" fill="#C0261B"/>`).join("")}
    ${cols.map((c,i)=>`<text x="${pad+i*step}" y="${h-pad+16}" text-anchor="middle" font-size="10"
      fill="#63536B">${esc(c)}</text>`).join("")}</svg>`;
}

function sectionHTML(sec){

function paintSection(){
  const sec = SECTIONS.find(s=>s.id===curSec) || SECTIONS[0];
  const i = SECTIONS.indexOf(sec);
  $("#csMain").innerHTML = sectionHTML(sec) + `<div class="navrow">
    <button class="btn line" id="prevSec" ${i===0?"disabled":""}>← ${i>0?esc(SECTIONS[i-1].title):""}</button>
    <button class="btn" id="nextSec" ${i===SECTIONS.length-1?"disabled":""}>${i<SECTIONS.length-1?esc(SECTIONS[i+1].title):""} →</button></div>`;
  $("#csRail").innerHTML = railHTML();
  $$("#csRail [data-sec]").forEach(b=>b.addEventListener("click",()=>{ curSec=b.dataset.sec; paintSection(); }));
  const prev = $("#prevSec"), next = $("#nextSec");
  if(prev) prev.addEventListener("click",()=>{ curSec=SECTIONS[i-1].id; paintSection(); });
  if(next) next.addEventListener("click",()=>{ curSec=SECTIONS[i+1].id; paintSection(); });
  paintMapBlock(); safetyPanel(); modalityHint(); progChart(); paintSaveDot();
  const p = $("#btnPrint"); if(p) p.addEventListener("click",printRecord);
  const rr = $("#btnReassess"); if(rr) rr.addEventListener("click",()=>{ newRecord(REC); curSec="cover"; render(); toast("Reassessment record created","good"); });
  const br = $("#btnRecords"); if(br) br.addEventListener("click",()=>{ REC=null; render(); });
  window.scrollTo(0,0);
}
/* one delegated listener covers every field on the page */
function bindInputs(){
  const root = ROOT;
  root.addEventListener("input", e=>{
    const el = e.target;
    if(el.dataset.k!==undefined && !el.dataset.multi){
      const v = el.type==="checkbox" ? el.checked : el.value;
      set(el.dataset.k, v);
      if(el.dataset.k==="height"||el.dataset.k==="weight") recalcBMI();
      if(el.dataset.k.startsWith("progress.0.")) progChart();
    }
    if(el.dataset.multi!==undefined){
      const key = el.dataset.multi;
      const vals = $$(`[data-multi="${key}"]`).filter(x=>x.checked).map(x=>x.value);
      set(key, vals);
    }
  });
  root.addEventListener("change", e=>{
    const el = e.target;
    if(el.dataset.k!==undefined && (el.type==="radio"||el.type==="checkbox"||el.tagName==="SELECT")){
      const v = el.type==="checkbox" ? el.checked : el.value;
      set(el.dataset.k, v);
      if(el.dataset.k.startsWith("safety.")){ safetyPanel(); modalityHint(); }
      $("#csRail").innerHTML = railHTML();
      $$("#csRail [data-sec]").forEach(b=>b.addEventListener("click",()=>{ curSec=b.dataset.sec; paintSection(); }));
    }
  });
}
function recalcBMI(){
  const h = Number(get("height")), w = Number(get("weight"));
  const bmi = (h>50 && w>5) ? (w/Math.pow(h/100,2)).toFixed(1) : "";
  REC.d.bmi = bmi; const el = $('[data-k="bmi"]'); if(el) el.value = bmi;
}

/* ══════════════════════════════════════════════════════════════════════════
   RECORDS LIST
   ══════════════════════════════════════════════════════════════════════════ */
function visible(){ return CUR_PATIENT ? DB.records.filter(r=>r.patientId===CUR_PATIENT) : DB.records; }
function recordsView(){
  const rows = visible().map(r=>{
    const filled = SECTIONS.filter(s=>{ const save=REC; REC=r; const f=secFilled(s); REC=save; return f; }).length;
    const pct = Math.round(filled/SECTIONS.length*100);
    const hard = HARD_ROWS.filter(i=>r.d[`safety.${i}.ans`]==="Yes").length;
    return `<tr>
      <td class="mono">${esc(r.d.clientId||"—")}</td>
      <td><strong>${esc(r.d.clientName||r.d.fullName||"Unnamed")}</strong>
        <div style="font-size:.78rem;color:var(--ink-soft)">${esc(r.d.stage||"Baseline")} · ${esc(r.d.practitioner||"—")}</div></td>
      <td>${fmtDate(r.d.assessDate)}</td>
      <td>${r.d.programme?`<span class="pill info">${esc(r.d.programme)}</span>`:"—"}</td>
      <td class="mono">${r.marks.length}</td>
      <td>${hard?`<span class="pill no">${hard} exclusion${hard>1?"s":""}</span>`
        :`<span class="pill ok">clear</span>`}</td>
      <td><div style="display:flex;gap:8px;align-items:center">
        <div class="bar"><i style="width:${pct}%"></i></div><span class="mono" style="font-size:.78rem">${pct}%</span></div></td>
      <td><div style="display:flex;gap:6px">
        <button class="btn sm" data-open="${r.id}">Open</button>
        <button class="btn line sm" data-dup="${r.id}">Reassess</button>
        <button class="btn line sm" data-del="${r.id}">Delete</button></div></td></tr>`;
  }).join("");
  return `<div class="pagehead"><h1>Assessment records</h1>
    <p class="note">Stored in this browser only. Nothing is transmitted anywhere, and clearing this browser's
    site data deletes them — export a backup at the end of each clinic day.</p></div>
  <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px">
    <button class="btn" id="newRec">New assessment</button>
    <input type="text" id="recSearch" placeholder="Search name or client ID" style="max-width:260px">
    <button class="btn line" id="expJson">Export all (JSON)</button>
    <button class="btn line" id="expCsv">Export all (CSV)</button>
    <button class="btn line" id="expMarks">Export body-map marks (CSV)</button>
    <label class="btn line" style="cursor:pointer">Import JSON<input type="file" id="impFile" accept=".json" style="display:none"></label>
  </div>
  <div class="block">
    ${DB.records.length?`<div class="tw"><table class="rec-tbl" id="recTbl">
      <thead><tr><th>Client ID</th><th>Name</th><th>Assessed</th><th>Programme</th><th>Marks</th>
        <th>Safety</th><th>Completed</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
     :`<p style="color:var(--ink-soft);margin:0">No records yet. Start the first assessment.</p>`}
  </div>`;
}
function bindRecords(){
  $("#newRec").addEventListener("click",()=>{ newRecord(); curSec="cover"; render(); toast("New record created","good"); });
  $$("[data-open]").forEach(b=>b.addEventListener("click",()=>{
    REC = DB.records.find(r=>r.id===b.dataset.open); curSec="cover"; selMark=null; render(); }));
  $$("[data-dup]").forEach(b=>b.addEventListener("click",()=>{
    newRecord(DB.records.find(r=>r.id===b.dataset.dup)); curSec="cover"; render();
    toast("Reassessment created — profile carried forward","good"); }));
  $$("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const r = DB.records.find(x=>x.id===b.dataset.del);
    if(!confirm(`Delete the record for ${r.d.clientName||"this client"}? This cannot be undone.`)) return;
    DB.records = DB.records.filter(x=>x.id!==r.id); persist(); render(); toast("Record deleted"); }));
  const s = $("#recSearch");
  if(s) s.addEventListener("input",()=>{
    const q = s.value.toLowerCase();
    $$("#recTbl tbody tr").forEach(tr=>{
      tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? "" : "none"; });
  });
  $("#expJson").addEventListener("click",()=>{
    dl(`psriem-assessments-${today()}.json`, JSON.stringify(DB,null,2), "application/json");
    toast("Backup downloaded","good"); });
  $("#expCsv").addEventListener("click", exportCSV);
  $("#expMarks").addEventListener("click", exportMarks);
  $("#impFile").addEventListener("change", async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const obj = JSON.parse(await f.text());
      if(!obj.records) throw new Error("shape");
      if(!confirm(`Import ${obj.records.length} record(s)? Existing records are kept; duplicates are not merged.`)) return;
      DB.records = obj.records.concat(DB.records); persist(); render(); toast("Records imported","good");
    }catch(err){ toast("That file is not a PSRIEM assessment backup","bad"); }
  });
}
function dl(name, text, type){
  const a = document.createElement("a");
  try{ a.href = URL.createObjectURL(new Blob([text],{type:type||"text/plain"})); }
  catch(e){ a.href = "data:text/plain;charset=utf-8,"+encodeURIComponent(text); }
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function allKeys(){
  const k = ["clientId","clientName","assessDate","practitioner","programme","stage"];
  SECTIONS.forEach(s=>keysOf(s).forEach(x=>{ if(!k.includes(x)) k.push(x); }));
  return k;
}
const csvCell = v => { v = Array.isArray(v)?v.join("|"):(v===true?"Yes":v===false?"":v??"");
  v = String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
function exportCSV(){
  const keys = allKeys();
  const head = keys.concat(["marks_count","marks_summary","record_created","record_updated"]);
  const rows = DB.records.map(r=>{
    const save = REC; REC = r; const summary = mapSummary(); REC = save;
    return keys.map(k=>csvCell(r.d[k])).concat([r.marks.length, csvCell(summary), r.created, r.updated]);
  });
  dl(`psriem-assessments-${today()}.csv`, [head.map(csvCell).join(","), ...rows.map(r=>r.join(","))].join("\n"), "text/csv");
  toast("CSV downloaded","good");
}
function exportMarks(){
  const head = ["client_id","client_name","assess_date","stage","view","mark_type","region","severity","x","y","note"];
  const rows = [];
  for(const r of DB.records) for(const m of r.marks)
    rows.push([r.d.clientId, r.d.clientName, r.d.assessDate, r.d.stage, m.view, MARK[m.type].label,
      m.region, m.sev, m.x, m.y, m.note].map(csvCell).join(","));
  if(!rows.length){ toast("No marks recorded yet","bad"); return; }
  dl(`psriem-bodymap-marks-${today()}.csv`, [head.join(","), ...rows].join("\n"), "text/csv");
  toast("Body-map marks downloaded","good");
}

/* ── print the whole record ── */
function printRecord(){
  const main = $("#csMain"), keep = main.innerHTML;
  main.classList.add("print-all");
  main.innerHTML = `<div style="text-align:center;border-bottom:2px solid #B98B31;padding-bottom:10px;margin-bottom:16px">
      <div style="font-family:var(--serif);font-size:1.3rem">PRAJÑĀ ŚAKTI RESEARCH INSTITUTE FOR ENERGY MEDICINE</div>
      <div style="font-size:.85rem">Comprehensive Integrative Health Assessment · ${esc(get("clientId"))} ·
        ${esc(get("clientName"))} · ${fmtDate(get("assessDate"))}</div></div>`
    + SECTIONS.map(sectionHTML).join("");
  main.querySelectorAll("svg[data-view]").forEach(svg=>drawMarks(svg, svg.dataset.view));
  const host = main.querySelector("[data-block='bodymap']");
  if(host && !host.innerHTML){ host.innerHTML = bodyMapBlock();
    host.querySelectorAll("svg[data-view]").forEach(svg=>drawMarks(svg, svg.dataset.view)); }
  if(mapSummary()){
    const s = document.createElement("div"); s.className="note";
    s.innerHTML = `<b>Body map summary</b>${esc(mapSummary())}`;
    if(host) host.appendChild(s);
  }
  setTimeout(()=>{
    window.print();
    main.classList.remove("print-all"); main.innerHTML = keep;
    paintSection();
  }, 300);
}

/* ══════════════════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════════════════ */
function render(){
  ROOT.innerHTML = shell();
  if(REC){
    paintSection();
    $("#topRecords").addEventListener("click",()=>{ persist(); REC=null; render(); });
    $("#topPrint").addEventListener("click", printRecord);
  }else{
    $("#csMain").innerHTML = recordsView();
    bindRecords();
    const n = $("#topNew"); if(n) n.addEventListener("click",()=>{
      newRecord(); curSec="cover"; render(); toast("New record created","good"); });
  }
}
addEventListener("beforeunload", e=>{ if(dirty) persist(); });
function mount(el, opts){
  ROOT = el; HOST = opts.host; CUR_PATIENT = opts.patientId || null;
  REC = null; curSec = "cover"; selMark = null;
  load();
  if(opts.recordId) REC = DB.records.find(r=>r.id===opts.recordId) || null;
  render(); bindInputs();
}
function summaryFor(pid){
  const list = HOST ? HOST.clinical().filter(r=>r.patientId===pid) : [];
  return {count:list.length, last:list[0]||null};
}
window.CLINICAL = {mount, summaryFor, sections:()=>SECTIONS, marks:()=>MARKS};

})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prajñā Śakti Research Institute for Energy Medicine — Care Portal</title>
<meta name="description" content="PSRIEM — integrative energy medicine. Book a consultation, explore the therapies and programmes, and manage assessments, sessions and clinical records.">
<meta name="theme-color" content="#1A0A26">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%232E1444'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23E3C179'>%E0%A5%90</text></svg>">
<style>

/* ============================================================
   PSRIEM CARE PORTAL — design tokens
   Palette derived from the institute's printed collateral:
   aubergine ground, antique gold rule, cream paper, coil-teal data
   ============================================================ */
:root{
  --vault:#24102F;        /* deep aubergine ground */
  --vault-2:#3A1B4E;      /* raised aubergine */
  --vault-3:#4E2A66;      /* hairline on dark */
  --gold:#C0913B;         /* antique gold */
  --gold-lt:#E3C179;      /* dawn gold */
  --paper:#FAF5EA;        /* cream paper */
  --paper-2:#F2E9D6;      /* sunk paper */
  --ink:#1C1220;          /* text on paper */
  --ink-soft:#5B4B63;
  --coil:#2C7C8C;         /* instrument teal — data + links */
  --coil-lt:#E1F0F2;
  --alert:#9E2B20;
  --alert-bg:#FBEAE7;
  --ok:#2C6E4A;
  --ok-bg:#E7F2EA;
  --warn:#8A6212;
  --warn-bg:#FBF2DC;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --r-s:4px; --r-m:10px; --r-l:20px;
  --sh:0 1px 0 rgba(28,18,32,.06), 0 8px 24px -14px rgba(36,16,47,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.15; margin:0 0 .4em; letter-spacing:-.01em}
h1{font-size:2.6rem} h2{font-size:1.9rem} h3{font-size:1.25rem} h4{font-size:1.02rem}
p{margin:0 0 .9em; max-width:72ch}
a{color:var(--coil); text-decoration:none; border-bottom:1px solid rgba(44,124,140,.35)}
a:hover{border-bottom-color:var(--coil)}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
:focus-visible{outline:3px solid var(--coil); outline-offset:2px; border-radius:2px}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- layout primitives ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 24px}
.grid{display:grid; gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.row.tight{gap:8px}
.spread{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap}
.stack>*+*{margin-top:14px}

/* ---------- masthead ---------- */
.mast{
  position:sticky; top:0; z-index:50; background:var(--vault);
  border-bottom:1px solid var(--vault-3); color:var(--paper);
}
.mast .wrap{display:flex; align-items:center; gap:18px; height:66px}
.seal{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:1.5px solid var(--gold);
  display:grid;place-items:center;font-family:var(--serif);color:var(--gold-lt);font-size:19px}
.mast-name{font-family:var(--serif); font-size:1.06rem; line-height:1.15}
.mast-name small{display:block;font-family:var(--sans);font-size:.68rem;color:#B9A6C4;letter-spacing:.06em}
.mast nav{margin-left:auto; display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.mast nav a{color:#DCCFE4; border:0; padding:8px 12px; border-radius:var(--r-s); font-size:.9rem}
.mast nav a:hover{background:var(--vault-2); color:#fff}
.mast nav a.on{background:var(--gold); color:var(--vault); font-weight:600}
.whoami{font-size:.8rem;color:#B9A6C4;text-align:right;line-height:1.3}
.whoami b{display:block;color:var(--gold-lt);font-size:.92rem}

/* ---------- hero ---------- */
.hero{position:relative; background:var(--vault); color:var(--paper); overflow:hidden;
  border-bottom:3px solid var(--gold)}
#coil{position:absolute; inset:0; width:100%; height:100%; display:block}
.hero .wrap{position:relative; z-index:2; padding-top:76px; padding-bottom:76px}
.hero h1{font-size:clamp(2.4rem,5.4vw,4rem); color:#fff; max-width:16ch}
.hero .lede{font-size:1.12rem; color:#DACFE1; max-width:56ch}
.shloka{border-left:2px solid var(--gold); padding:2px 0 2px 16px; margin:26px 0 30px; max-width:60ch}
.shloka .dev{font-size:1.16rem; color:var(--gold-lt); font-family:var(--serif)}
.shloka .tel{font-size:1.06rem; color:#CBB9D6}
.shloka .tr{font-size:.86rem; color:#A895B4; font-style:italic; margin-top:6px}

/* ---------- buttons ---------- */
.btn{display:inline-block; border:1px solid transparent; border-radius:var(--r-s); cursor:pointer;
  padding:11px 20px; font-size:.94rem; font-weight:600; background:var(--gold); color:var(--vault);
  transition:transform .12s ease, background .15s ease; text-decoration:none}
.btn:hover{background:var(--gold-lt); transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; color:var(--gold-lt); border-color:var(--gold)}
.btn.ghost:hover{background:rgba(192,145,59,.14)}
.btn.plain{background:var(--vault); color:#fff}
.btn.plain:hover{background:var(--vault-2)}
.btn.line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--paper-2)}
.btn.teal{background:var(--coil);color:#fff}
.btn.teal:hover{background:#23697a}
.btn.danger{background:var(--alert);color:#fff}
.btn.sm{padding:6px 12px; font-size:.83rem}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}

/* ---------- surfaces ---------- */
.panel{background:#fff; border:1px solid var(--paper-2); border-radius:var(--r-m); padding:22px; box-shadow:var(--sh)}
.panel.flat{box-shadow:none}
.slab{background:var(--paper-2); border-radius:var(--r-m); padding:18px}
.section{padding:64px 0}
.section.tinted{background:var(--paper-2)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);border:0;margin:34px 0}
.kicker{font-family:var(--serif); font-size:1.02rem; color:var(--gold); font-style:italic; margin-bottom:6px}

/* ---------- instrument cards (perspective tilt + flip) ---------- */
.inst-deck{display:grid; gap:22px; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); perspective:1200px}
.inst{position:relative; background:#fff; border:1px solid var(--paper-2); border-radius:var(--r-m);
  padding:22px; cursor:pointer; transform-style:preserve-3d; transition:box-shadow .2s ease;
  box-shadow:var(--sh); text-align:left; width:100%; font:inherit}
.inst:hover{box-shadow:0 14px 40px -18px rgba(36,16,47,.6)}
.inst .glyph{width:56px;height:56px;margin-bottom:14px}
.inst h3{margin-bottom:2px}
.inst .sub{font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
.inst .modal-hint{font-size:.8rem;color:var(--coil);font-weight:600}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:.73rem;background:var(--paper-2);border-radius:100px;padding:3px 10px;color:var(--ink-soft)}
.chip.t{background:var(--coil-lt);color:#1d5b68}
.chip.g{background:#F6ECD5;color:var(--warn)}
.chip.r{background:var(--alert-bg);color:var(--alert)}
.chip.k{background:var(--ok-bg);color:var(--ok)}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:.9rem}
th{text-align:left; font-weight:600; color:var(--ink-soft); border-bottom:2px solid var(--paper-2); padding:9px 10px; font-size:.8rem}
td{padding:10px; border-bottom:1px solid var(--paper-2); vertical-align:middle}
tr:hover td{background:#FCF9F2}
.tbl-scroll{overflow-x:auto}

/* ---------- forms ---------- */
label{display:block; font-size:.83rem; font-weight:600; color:var(--ink-soft); margin-bottom:5px}
.field{margin-bottom:16px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%; padding:10px 12px; border:1px solid #DCD1BE; border-radius:var(--r-s); background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--coil)}
textarea{min-height:82px; resize:vertical}
.help{font-size:.78rem;color:var(--ink-soft);margin-top:4px}
.err{color:var(--alert); font-size:.82rem; margin-top:4px; font-weight:600}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--paper-2)}
.checkrow input{margin-top:4px;width:17px;height:17px;flex:0 0 17px;accent-color:var(--coil)}
.checkrow label{margin:0;font-weight:400;color:var(--ink);font-size:.92rem}
.checkrow small{display:block;color:var(--ink-soft);font-size:.78rem}

/* ---------- notices ---------- */
.notice{border-left:4px solid var(--coil); background:var(--coil-lt); padding:13px 16px; border-radius:0 var(--r-s) var(--r-s) 0; font-size:.9rem}
.notice.bad{border-color:var(--alert); background:var(--alert-bg)}
.notice.good{border-color:var(--ok); background:var(--ok-bg)}
.notice.warn{border-color:var(--warn); background:var(--warn-bg)}
.notice b{display:block;margin-bottom:2px}

/* ---------- app shell ---------- */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); gap:0; min-height:calc(100vh - 66px)}
.rail{background:var(--vault); padding:22px 0; border-right:1px solid var(--vault-3)}
.rail .grp{color:#8E7A9B; font-size:.7rem; letter-spacing:.12em; padding:16px 22px 6px; font-weight:700}
.rail button{display:block; width:100%; text-align:left; background:none; border:0; color:#D6C9DE;
  padding:10px 22px; cursor:pointer; font-size:.92rem; border-left:3px solid transparent}
.rail button:hover{background:var(--vault-2); color:#fff}
.rail button.on{background:var(--vault-2); color:var(--gold-lt); border-left-color:var(--gold); font-weight:600}
.rail .badge{float:right; background:var(--alert); color:#fff; border-radius:100px; font-size:.7rem; padding:0 7px; font-weight:700}
.main{padding:32px 34px 80px; min-width:0}

/* ---------- stats ---------- */
.stat{background:#fff;border:1px solid var(--paper-2);border-radius:var(--r-m);padding:16px 18px}
.stat .n{font-family:var(--serif); font-size:2.1rem; line-height:1; color:var(--vault)}
.stat .l{font-size:.8rem;color:var(--ink-soft);margin-top:6px}
.stat.t .n{color:var(--coil)} .stat.a .n{color:var(--alert)} .stat.k .n{color:var(--ok)}

/* ---------- progress ---------- */
.bar{height:9px;background:var(--paper-2);border-radius:100px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coil),#4aa8ba);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.gold i{background:linear-gradient(90deg,var(--gold),var(--gold-lt))}
.ring{--p:0; width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--coil) calc(var(--p)*1%), var(--paper-2) 0);transition:--p .8s}
.ring span{width:78px;height:78px;background:#fff;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:1.4rem;color:var(--vault)}

/* ---------- slider ---------- */
.slider{width:100%;accent-color:var(--coil)}
.vas{display:flex;align-items:center;gap:14px}
.vas output{font-family:var(--serif);font-size:1.6rem;min-width:2.4ch;text-align:center;color:var(--vault)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,10,36,.62);z-index:100;display:grid;place-items:center;padding:20px;
  animation:fade .18s ease}
.modal{background:var(--paper);border-radius:var(--r-l);max-width:820px;width:100%;max-height:88vh;overflow:auto;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7); animation:rise .24s cubic-bezier(.2,.9,.3,1)}
.modal-head{background:var(--vault);color:#fff;padding:24px 28px;border-radius:var(--r-l) var(--r-l) 0 0;position:sticky;top:0;z-index:2}
.modal-head h2{color:#fff;margin:0}
.modal-head .sub{color:var(--gold-lt);font-size:.88rem}
.modal-body{padding:26px 28px 30px}
.x{position:absolute;top:20px;right:22px;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- toast ---------- */
#toast{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--vault);color:#fff;padding:13px 18px;border-radius:var(--r-s);
  border-left:4px solid var(--gold);box-shadow:0 12px 30px -12px rgba(0,0,0,.6);max-width:330px;font-size:.9rem;
  animation:rise .2s ease}
.toast.bad{border-left-color:var(--alert)} .toast.good{border-left-color:#5ec98d}

/* ---------- misc ---------- */
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:100px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.no{background:var(--alert-bg);color:var(--alert)}
.pill.wait{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--coil-lt);color:#1d5b68}
.mono{font-variant-numeric:tabular-nums}
.foot{background:var(--vault);color:#A895B4;padding:30px 0;font-size:.85rem;border-top:3px solid var(--gold)}
.foot a{color:var(--gold-lt);border:0}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--paper-2)}
.step .n{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--vault);color:var(--gold-lt);
  display:grid;place-items:center;font-size:.82rem;font-family:var(--serif)}
details.faq{border-bottom:1px solid var(--paper-2);padding:14px 0}
details.faq summary{cursor:pointer;font-weight:600;font-family:var(--serif);font-size:1.06rem;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:before{content:"+";color:var(--gold);margin-right:10px;font-weight:700}
details.faq[open] summary:before{content:"–"}
details.faq p{margin-top:10px;color:var(--ink-soft)}

/* ---------- membership plan cards ---------- */
.plans{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));align-items:start}
.plan{background:#fff;border:1px solid var(--paper-2);border-radius:var(--r-m);overflow:hidden;
  box-shadow:var(--sh);display:flex;flex-direction:column;position:relative}
.plan.pop{box-shadow:0 18px 46px -20px rgba(36,16,47,.55);border-color:var(--gold)}
.plan .cap{padding:22px 20px 18px;color:#fff;text-align:center}
.plan .cap h3{color:#fff;margin:0;font-size:1.7rem;letter-spacing:.02em}
.plan .cap .sub{font-size:.76rem;color:rgba(255,255,255,.85);line-height:1.35;margin-top:3px}
.plan .lotus{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);
  display:grid;place-items:center;margin:0 auto 10px;font-size:1.2rem;color:#fff}
.plan .line{background:var(--paper-2);padding:9px 16px;text-align:center;font-family:var(--serif);
  font-size:.95rem;font-style:italic;color:var(--ink)}
.plan .inh{padding:8px 18px 0;font-size:.76rem;color:var(--ink-soft);font-weight:700}
.plan ul{list-style:none;margin:0;padding:12px 18px;flex:1}
.plan li{display:flex;gap:8px;font-size:.85rem;padding:4px 0;line-height:1.45}
.plan li:before{content:"✓";color:var(--ok);font-weight:700;flex:0 0 auto}
.plan .fees{margin:0 14px 14px;border:1px solid var(--paper-2);border-radius:var(--r-s);overflow:hidden}
.plan .fees table{font-size:.83rem}
.plan .fees th{background:var(--paper-2);color:var(--ink);padding:7px 9px;border:0;font-size:.72rem}
.plan .fees td{padding:8px 9px;border-bottom:1px solid var(--paper-2)}
.plan .was{text-decoration:line-through;color:var(--ink-soft);font-size:.8rem}
.plan .off{background:var(--alert);color:#fff;border-radius:3px;padding:1px 5px;font-size:.68rem;font-weight:700}
.plan .now{font-weight:700;font-variant-numeric:tabular-nums}
.plan .motto{padding:12px 16px;text-align:center;font-family:var(--serif);font-style:italic;
  background:var(--paper);border-top:1px solid var(--paper-2);font-size:.92rem}
.plan .flag{position:absolute;top:0;right:0;background:var(--alert);color:#fff;font-size:.68rem;
  font-weight:700;padding:5px 12px;border-radius:0 0 0 var(--r-s);letter-spacing:.05em}
.journey{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));counter-reset:j}
.journey .j{text-align:center;padding:14px 10px;background:#fff;border:1px solid var(--paper-2);border-radius:var(--r-m)}
.journey .j b{display:block;font-family:var(--serif);font-size:1rem;margin-bottom:3px}
.journey .j .n{width:26px;height:26px;border-radius:50%;background:var(--vault);color:var(--gold-lt);
  display:grid;place-items:center;font-size:.78rem;margin:0 auto 8px}
.journey .j small{color:var(--ink-soft);font-size:.79rem;line-height:1.4;display:block}
.receipt{font-family:var(--serif)}
.receipt table td,.receipt table th{padding:7px 4px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:flex;overflow-x:auto;padding:8px 0;gap:2px}
  .rail .grp{display:none}
  .rail button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:9px 16px}
  .rail button.on{border-left:0;border-bottom-color:var(--gold)}
  .main{padding:22px 18px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .mast .wrap{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
@media print{.mast,.rail,.foot,.btn,#toast{display:none !important} .shell{grid-template-columns:1fr}}

/* ══════════════════════════════════════════════════════════════════════════
   PREMIUM LAYER — hero, depth, motion
   ══════════════════════════════════════════════════════════════════════════ */
.hero3d{position:relative;overflow:hidden;background:#1A0A26;color:#F4ECF8;isolation:isolate;
  min-height:min(92vh,860px);display:flex;align-items:center}
.hero3d canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.aurora{position:absolute;inset:-20%;z-index:0;filter:blur(70px);opacity:.85}
.aurora i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;
  animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:2%;top:6%;background:#5B2A7E;animation-delay:-2s}
.aurora i:nth-child(2){width:38vw;height:38vw;right:4%;top:0%;background:#B98B31;opacity:.55;animation-delay:-9s}
.aurora i:nth-child(3){width:44vw;height:44vw;left:30%;bottom:-14%;background:#1F5F6E;opacity:.6;animation-delay:-15s}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(4vw,-3vw,0) scale(1.14)}
  100%{transform:translate3d(-3vw,4vw,0) scale(.94)}
}
.hero3d:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 80% at 20% 40%, rgba(26,10,38,.20) 0%, rgba(26,10,38,.86) 72%),
             linear-gradient(180deg, rgba(26,10,38,.55) 0%, rgba(26,10,38,0) 26%, rgba(26,10,38,.92) 100%)}
.hero3d .wrap{position:relative;z-index:3;padding:96px 24px 84px;width:100%}
.hero3d .eyebrow{font-family:var(--serif);font-style:italic;color:#E3C179;font-size:1.06rem;
  letter-spacing:.02em;margin-bottom:14px}
.hero3d h1{font-size:clamp(2.6rem,6.6vw,5rem);line-height:.98;color:#fff;max-width:14ch;margin:0 0 22px;
  letter-spacing:-.025em;text-shadow:0 18px 60px rgba(0,0,0,.55)}
.hero3d h1 .ln{display:block;overflow:hidden}
.hero3d h1 .ln span{display:block;transform:translateY(105%);animation:riseIn .95s cubic-bezier(.16,1,.3,1) forwards}
.hero3d h1 .ln:nth-child(2) span{animation-delay:.10s}
.hero3d h1 .ln:nth-child(3) span{animation-delay:.20s}
.hero3d h1 .ln:nth-child(3) span{color:#E3C179}
@keyframes riseIn{to{transform:translateY(0)}}
.hero3d .lede{font-size:1.14rem;color:#D6C6E0;max-width:54ch;opacity:0;animation:fadeUp .9s .42s cubic-bezier(.16,1,.3,1) forwards}
.hero3d .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px;opacity:0;

/* scroll reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;transform:none}
.rv-d1{transition-delay:.07s} .rv-d2{transition-delay:.14s} .rv-d3{transition-delay:.21s}

/* 3D tilt */
.tiltwrap{perspective:1100px}
.tilt{transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s ease;transform-style:preserve-3d;will-change:transform}
.tilt:hover{box-shadow:0 30px 70px -30px rgba(46,20,68,.55)}

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   PREMIUM MOTION LAYER
   A small hand-written 3D renderer — no libraries, no WebGL. Points are
   rotated in three axes, perspective-projected, depth-sorted and drawn to a
   2D canvas, so it runs on any browser the clinic happens to have.
   ══════════════════════════════════════════════════════════════════════════ */
let heroRAF = 0;
function startHero3D(){
  const cv = document.getElementById("hero3d");
  if(!cv) return;
  cancelAnimationFrame(heroRAF);
  const ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0, H=0, t=0, mx=0, my=0, tmx=0, tmy=0, scroll=0;

  function size(){
    const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio||1, 2);
    W = r.width; H = r.height; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
  }
  size();
  addEventListener("resize", size, {passive:true});
  const host = cv.parentElement;
  host.addEventListener("pointermove", e=>{
    const r = host.getBoundingClientRect();
    tmx = ((e.clientX-r.left)/r.width - .5) * 0.85;
    tmy = ((e.clientY-r.top)/r.height - .5) * 0.55;
  }, {passive:true});
  host.addEventListener("pointerleave", ()=>{ tmx = 0; tmy = 0; });
  addEventListener("scroll", ()=>{ scroll = Math.min(1, (window.scrollY||0)/700); }, {passive:true});

  /* ── geometry ── */
  const coils = [];                                  // three Helmholtz-style rings
  for(let k=0;k<3;k++){
    const pts = [], R = 1 - k*0.115;
    for(let i=0;i<128;i++){
      const a = i/128*Math.PI*2;
      pts.push([Math.cos(a)*R, Math.sin(a)*R, (k-1)*0.40]);
    }
    coils.push({pts, k});
  }
  const helix = [];                                  // a coil winding, the signature of a PEMF ring
  for(let i=0;i<260;i++){
    const u = i/260, a = u*Math.PI*14;
    helix.push([Math.cos(a)*(0.98+0.05*Math.sin(u*Math.PI*4)), Math.sin(a)*0.99, (u-0.5)*0.95]);
  }
  const motes = Array.from({length:220},()=>({
    a: Math.random()*Math.PI*2,
    r: 0.28 + Math.random()*1.35,
    z: (Math.random()-.5)*1.9,
    s: 0.25 + Math.random()*0.95,
    ph: Math.random()*Math.PI*2
  }));

  function project(p, ry, rx, cx, cy, sc){
    const [x,y,z] = p;
    const x1 =  x*Math.cos(ry) - z*Math.sin(ry);
    const z1 =  x*Math.sin(ry) + z*Math.cos(ry);
    const y1 =  y*Math.cos(rx) - z1*Math.sin(rx);
    const z2 =  y*Math.sin(rx) + z1*Math.cos(rx);
    const f = 3.4/(3.4 + z2);
    return [cx + x1*sc*f, cy + y1*sc*f, f, z2];
  }

  function frame(){
    mx += (tmx-mx)*0.06; my += (tmy-my)*0.06;
    ctx.clearRect(0,0,W,H);
    const wide = W > 900;
    const cx = wide ? W*0.735 : W*0.5;
    const cy = (wide ? H*0.50 : H*0.66) - scroll*70;
    const sc = Math.min(W*(wide?0.42:0.72), H*0.44);
    const ry = t*0.0042 + mx*1.15;
    const rx = -0.40 + my*0.9 + scroll*0.25;
    const beat = 0.5 + 0.5*Math.sin(t*0.022);

    /* ground pulse — the field leaving the coil */
    for(let i=0;i<5;i++){
      const ph = ((t*0.0042 + i*0.2) % 1);
      ctx.beginPath();
      ctx.ellipse(cx, cy + sc*0.74, sc*(0.20+ph*1.55), sc*(0.06+ph*0.52), 0, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(227,193,121,${(1-ph)*0.24})`;
      ctx.lineWidth = 1.1; ctx.stroke();
    }

    /* depth-sorted particles */
    const drawn = motes.map(m=>{
      const a = m.a + t*0.0013*m.s;
      const p = project([Math.cos(a)*m.r, Math.sin(a)*m.r*0.62, m.z], ry, rx, cx, cy, sc);
      return {p, m};
    }).sort((A,B)=>B.p[3]-A.p[3]);
    for(const {p,m} of drawn){
      const glow = 0.30 + 0.70*Math.abs(Math.sin(t*0.017*m.s + m.ph));
      const r = (1.7*p[2]*m.s + 0.35);
      ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI*2);
      ctx.fillStyle = p[3] > 0
        ? `rgba(150,110,190,${0.10 + glow*0.22})`
        : `rgba(227,193,121,${0.14 + glow*0.40})`;
      ctx.fill();
    }

    /* the winding */
    ctx.beginPath();
    helix.forEach((p,i)=>{ const q = project(p, ry, rx, cx, cy, sc);
      i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); });
    ctx.strokeStyle = `rgba(122,182,198,${0.16 + beat*0.20})`;
    ctx.lineWidth = 1; ctx.stroke();

    /* coil rings */
    for(const c of coils){
      ctx.beginPath();
      c.pts.forEach((p,i)=>{ const q = project(p, ry, rx, cx, cy, sc);
        i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]); });
      ctx.closePath();
      const pulse = 0.35 + 0.65*Math.abs(Math.sin(t*0.021 - c.k*0.75));
      ctx.strokeStyle = c.k===1 ? `rgba(227,193,121,${0.45+pulse*0.55})`
                                : `rgba(133,186,204,${0.22+pulse*0.42})`;
      ctx.lineWidth = c.k===1 ? 3.6 : 2.1;
      ctx.stroke();
      if(c.k===1){
        const centre = project([0,0,0], ry, rx, cx, cy, sc);
        for(let i=0;i<128;i+=8){
          const q = project(c.pts[i], ry, rx, cx, cy, sc);
          ctx.beginPath(); ctx.moveTo(centre[0],centre[1]); ctx.lineTo(q[0],q[1]);
          ctx.strokeStyle = `rgba(185,139,49,${0.03+pulse*0.07})`; ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }

    /* core glow */
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,sc*0.62);
    const b = 0.13 + 0.17*beat;
    g.addColorStop(0, `rgba(227,193,121,${b})`);
    g.addColorStop(0.55, `rgba(150,90,190,${b*0.35})`);
    g.addColorStop(1, "rgba(227,193,121,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,sc*0.62,0,Math.PI*2); ctx.fill();

    if(!still) t++;
    heroRAF = requestAnimationFrame(frame);
  }
  frame();
}

/* ── scroll reveal ── */
let revealObs = null;
function revealAll(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  if(!revealObs){
    revealObs = new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); revealObs.unobserve(en.target); } });
    }, {rootMargin:"0px 0px -8% 0px", threshold:0.06});
  }
  els.forEach(e=>revealObs.observe(e));
}
function markReveal(root){
  const sel = "#publicSite .sec > .wrap > *, #publicSite .plan, #publicSite .th, #publicSite .jr, #publicSite .card";
  (root||document).querySelectorAll(sel).forEach((el,i)=>{
    el.classList.add("rv");
    if(i%3===1) el.classList.add("rv-d1");
    if(i%3===2) el.classList.add("rv-d2");
  });
  revealAll();
}

/* ── pointer tilt ── */
function bindTilt(root){
  const targets = (root||document).querySelectorAll("#publicSite .plan, #publicSite .th, .inst, #publicSite .card");
  targets.forEach(el=>{
    if(el.dataset.tilt) return;
    el.dataset.tilt = "1";
    el.classList.add("tilt");
    if(el.parentElement && !el.parentElement.classList.contains("tiltwrap"))
      el.parentElement.classList.add("tiltwrap");
    el.addEventListener("pointermove", e=>{
      if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const r = el.getBoundingClientRect();
      const rx = ((e.clientY-r.top)/r.height - .5) * -6.5;
      const ry = ((e.clientX-r.left)/r.width  - .5) *  8.5;
      el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(10px)`;
    });
    el.addEventListener("pointerleave", ()=>{ el.style.transform = ""; });
  });
}

/* ---- crypto ---- */
const enc = new TextEncoder();
async function pbkdf2(pw, saltB64, iter=150000){
  const salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
const newSalt = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
async function hashPw(pw){ const salt = newSalt(); return {salt, hash: await pbkdf2(pw, salt)}; }
async function checkPw(pw, user){ return (await pbkdf2(pw, user.salt)) === user.hash; }

async function aesKey(pass, saltB64){
  const salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(obj, pass){
  const salt = newSalt(), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await aesKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  return {psriem:"sealed-export", v:1, salt, iv:btoa(String.fromCharCode(...iv)),
          data:btoa(String.fromCharCode(...new Uint8Array(ct)))};
}
async function unseal(pkg, pass){
  const key = await aesKey(pass, pkg.salt);
  const iv = Uint8Array.from(atob(pkg.iv), c=>c.charCodeAt(0));
  const ct = Uint8Array.from(atob(pkg.data), c=>c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---- tiny SVG charts (no dependencies) ---- */
function barChart(data, opts={}){
  const w = opts.w||520, h = opts.h||190, pad = 34;
  const hasNeg = data.some(d=>d.v<0);
  const max = Math.max(1, ...data.map(d=>Math.abs(d.v)));
  const zone = h - pad*2;
  const base = hasNeg ? pad + zone/2 : h - pad;
  const unit = hasNeg ? (zone/2)/max : zone/max;
  const bw = (w - pad*2) / data.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img">
    ${data.map((d,i)=>{
      const bh = Math.abs(d.v)*unit;
      const x = pad + i*bw + bw*0.18;
      const y = d.v>=0 ? base-bh : base;
      const col = d.c || (d.v<0 ? "#9E2B20" : "#2C7C8C");
      return `<rect x="${x}" y="${y}" width="${bw*0.64}" height="${Math.max(bh,1)}" rx="3" fill="${col}"/>
        <text x="${x+bw*0.32}" y="${d.v>=0?y-6:y+bh+13}" text-anchor="middle" font-size="11" fill="#5B4B63">${d.v}</text>
        <text x="${x+bw*0.32}" y="${h-pad+16}" text-anchor="middle" font-size="10.5" fill="#5B4B63">${esc(d.l)}</text>`;
    }).join("")}
    <line x1="${pad-6}" y1="${base}" x2="${w-pad+6}" y2="${base}" stroke="#D9CBB4"/></svg>`;
}
function lineChart(series, labels, opts={}){
  const w = opts.w||560, h = opts.h||210, pad = 36, max = opts.max||10;
  const step = (w-pad*2)/Math.max(1,labels.length-1);
  const pt = (v,i)=>[pad+i*step, h-pad-(h-pad*2)*(v/max)];
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img">
    ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" y1="${h-pad-(h-pad*2)*f}" x2="${w-pad}" y2="${h-pad-(h-pad*2)*f}" stroke="#EFE6D4"/>
      <text x="${pad-8}" y="${h-pad-(h-pad*2)*f+4}" text-anchor="end" font-size="10" fill="#8A7B92">${Math.round(max*f)}</text>`).join("")}
    ${series.map(s=>{
      const d = s.v.map((v,i)=>{const [x,y]=pt(v,i); return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(" ");
      return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round"/>
        ${s.v.map((v,i)=>{const [x,y]=pt(v,i); return `<circle cx="${x}" cy="${y}" r="3.6" fill="${s.c}"/>`;}).join("")}`;
    }).join("")}
    ${labels.map((l,i)=>`<text x="${pad+i*step}" y="${h-pad+16}" text-anchor="middle" font-size="10" fill="#5B4B63">${esc(l)}</text>`).join("")}
    </svg>
    <div class="row tight" style="margin-top:8px">${series.map(s=>`<span class="chip" style="background:${s.c}22;color:${s.c}">${esc(s.n)}</span>`).join("")}</div>`;
}
/* ==========================================================================
   4. SCORING + RECOMMENDATION ENGINE
   Every domain is normalised 0–100 as a *burden* score (higher = worse).
   The Wellness Index is 100 minus the weighted burden, so a rising index
   between the pre and post assessment is the primary research outcome.
   ========================================================================== */
const n4 = v => (Number(v)||0)/4*100;      // 0–4 item to 0–100
const n10 = v => (Number(v)||0)*10;        // 0–10 VAS to 0–100

function scoreAssessment(a){
  const x = a.answers;
  const pain    = (n10(x.pain_now)*0.6 + n10(x.pain_worst)*0.4);
  const funcs   = [x.walk,x.stairs,x.bend,x.balance].map(n4);
  const fn      = funcs.reduce((s,v)=>s+v,0)/funcs.length;
  const neuro   = (n4(x.radiating)*0.6 + n4(x.weakness)*0.4);
  const circ    = (n4(x.swelling)*0.7 + n4(x.spasm)*0.3);
  const systemic= (n10(x.fatigue)+n10(x.sleep)+n10(x.stress)+n10(x.mood))/4;
  const boneRisk= (x.bonedx==="yes"?55:0) + ({low:0,mid:8,high:18,vhigh:26}[x.sedentary]||0)
                + ({daily:0,weekly:6,rare:14,none:22}[x.activity]||0) + (n4(x.balance)*0.2);
  const chr     = ({acute:0,subacute:8,chronic:16,years:22}[x.duration]||0);
  const stiff   = ({none:0,short:20,mid:55,long:85}[x.stiffness]||0);
  const round = v => Math.round(Math.min(100,Math.max(0,v)));
  const d = {pain:round(pain), fn:round(fn), neuro:round(neuro), circ:round(circ),
             systemic:round(systemic), bone:round(boneRisk), chronicity:round(chr), stiffness:round(stiff),
             spasm:round(n4(x.spasm)), weakness:round(n4(x.weakness)), balance:round(n4(x.balance))};
  const burden = d.pain*0.30 + d.fn*0.25 + d.neuro*0.15 + d.systemic*0.20 + d.circ*0.10;
  d.index = round(100 - burden);
  d.burden = round(burden);
  return d;
}

/* --- which flags did the patient tick, and what does that block? --- */
function activeFlags(p){ return (p.flags||[]).filter(f=>FLAG[f]); }
function eligibility(p){
  const flags = activeFlags(p), out = {};
  for(const ins of INSTRUMENTS){
    const blockers = flags.filter(f=>ins.hard.includes(f));
    const cautions = flags.filter(f=>ins.soft.includes(f));
    out[ins.id] = {ok: blockers.length===0, blockers, cautions};
  }
  return out;
}

/* --- recommendation: score each instrument 0–100 against the profile --- */
function recommend(a, patient){
  const x = a.answers, d = a.scores, elig = eligibility(patient);
  const R = (x.regions||[]), has = r => R.includes(r);
  const focal = ["low_back","neck","knee","hip","elbow","ankle"].some(has);
  const yes = k => x[k]==="yes";
  const S = {};

  S.IFT = d.pain*0.42 + d.neuro*0.24 + d.spasm*0.16 + (focal?14:0)
        + (x.character==="sharp"||x.character==="burn"?8:0) + (d.chronicity>0?4:0);
  S.MAG = d.pain*0.28 + d.fn*0.18 + (yes("arthritis")?22:0) + (yes("postsurgical")?18:0)
        + (has("knee")||has("hip")||has("elbow")||has("ankle")?16:0) + (d.stiffness*0.12) + (yes("bonedx")?8:0);
  S.PUL = d.systemic*0.46 + (has("multisite")?22:0) + d.circ*0.14 + (d.chronicity*0.5)
        + (d.fn>50?8:0) + (R.length>2?10:0);
  S.WBV = d.bone*0.34 + d.weakness*0.26 + d.balance*0.20 + d.circ*0.12
        + ({low:0,mid:4,high:10,vhigh:14}[x.sedentary]||0);
  S.G5  = d.stiffness*0.30 + d.spasm*0.34 + (yes("sports")?18:0) + (has("neck")||has("low_back")?12:0)
        + (d.pain*0.12);

  const list = INSTRUMENTS.map(ins=>{
    const e = elig[ins.id];
    const raw = Math.round(Math.min(100, S[ins.id]||0));
    return {id:ins.id, name:ins.name, score: e.ok?raw:0, raw, ok:e.ok,
            blockers:e.blockers, cautions:e.cautions, why: rationale(ins.id, x, d, patient)};
  });
  list.sort((a,b)=> b.score-a.score || b.raw-a.raw);
  return list;
}
function rationale(id, x, d, p){
  const R = x.regions||[], nm = k => (REGIONS.find(r=>r[0]===k)||[,k])[1];
  const w = [];
  if(id==="IFT"){
    if(d.pain>=50) w.push(`pain scored ${d.pain}/100`);
    if(d.neuro>=40) w.push("pain radiating into a limb");
    if(d.spasm>=50) w.push("marked muscle spasm");
    if(R.length && R[0]!=="multisite") w.push(`a definable target at the ${nm(R[0]).toLowerCase()}`);
  }
  if(id==="MAG"){
    if(x.arthritis==="yes") w.push("diagnosed arthritis");
    if(x.postsurgical==="yes") w.push("recent surgery needing bone and joint recovery");
    if(["knee","hip","elbow","ankle"].some(k=>R.includes(k))) w.push("a single joint as the main complaint");
    if(d.stiffness>=55) w.push("prolonged morning stiffness");
  }
  if(id==="PUL"){
    if(d.systemic>=45) w.push(`systemic burden ${d.systemic}/100 across fatigue, sleep and stress`);
    if(R.includes("multisite")||R.length>2) w.push("symptoms in several regions at once");
    if(d.chronicity>=16) w.push("a long-standing problem");
  }
  if(id==="WBV"){
    if(d.bone>=40) w.push(`bone-loading risk ${d.bone}/100`);
    if(d.weakness>=50) w.push("reported muscle weakness");
    if(d.balance>=50) w.push("unsteadiness on the feet");
    if(["high","vhigh"].includes(x.sedentary)) w.push("a highly sedentary day");
  }
  if(id==="G5"){
    if(d.spasm>=50) w.push("tight, knotted muscle");
    if(d.stiffness>=40) w.push("stiffness as a main feature");
    if(x.sports==="yes") w.push("a sports or exercise origin");
  }
  return w.length ? w.join(", ") : "a low match against this profile";
}

   5. DERIVED QUERIES
   ========================================================================== */
const patientOf = userId => DB.patients.find(p=>p.userId===userId);
const patientById = id => DB.patients.find(p=>p.id===id);
const userById = id => DB.users.find(u=>u.id===id);
const rxOf = pid => DB.prescriptions.filter(r=>r.patientId===pid).sort((a,b)=>b.startDate.localeCompare(a.startDate));
const sessionsOf = pid => DB.sessions.filter(s=>s.patientId===pid).sort((a,b)=>a.date.localeCompare(b.date));
const sessionsOfRx = rid => DB.sessions.filter(s=>s.prescriptionId===rid).sort((a,b)=>a.seq-b.seq);
const assessOf = pid => DB.assessments.filter(a=>a.patientId===pid).sort((a,b)=>a.date.localeCompare(b.date));

function rxProgress(rx){
  const done = sessionsOfRx(rx.id).filter(s=>s.status==="completed").length;
  const missed = sessionsOfRx(rx.id).filter(s=>s.status==="missed").length;
  return {done, missed, total:rx.totalSessions, left:Math.max(0,rx.totalSessions-done),
          pct: Math.round(done/rx.totalSessions*100),
          adherence: (done+missed) ? Math.round(done/(done+missed)*100) : 100};
}
function nextDue(rx){
  const ss = sessionsOfRx(rx.id).filter(s=>s.status==="completed");
  if(!ss.length) return rx.startDate;
  const last = ss[ss.length-1].date;
  const gap = Math.max(1, Math.round(7/(rx.perWeek||3)));
  const d = new Date(last); d.setDate(d.getDate()+gap);
  return d.toISOString().slice(0,10);
}

/* --- reminders are computed live, never stale --- */
function remindersFor(pid){
  const out = [], p = patientById(pid); if(!p) return out;
  out.push(...membershipReminders(pid));
  const as = assessOf(pid);
  if(!as.length) out.push({kind:"assess", level:"warn", text:"Baseline assessment not completed yet. It takes about 5 minutes and decides which therapy is recommended."});
  for(const rx of rxOf(pid)){
    if(rx.status!=="active") continue;
    const pr = rxProgress(rx);
    const due = nextDue(rx);
    if(pr.left===0){
      const hasPost = as.some(a=>a.type==="post" && a.rxId===rx.id);
      if(!hasPost) out.push({kind:"post", level:"bad", rxId:rx.id,
        text:`All ${rx.totalSessions} sessions of ${INST[rx.instrumentId].name} are complete. Your post-treatment assessment is due — this is what tells us whether the course worked.`});
      else out.push({kind:"done", level:"good", text:`${INST[rx.instrumentId].name} course finished and post-assessment recorded.`});
    } else if(pr.done>0 && pr.done === Math.floor(rx.totalSessions/2)
              && !as.some(a=>a.type==="mid" && a.rxId===rx.id)){
      out.push({kind:"mid", level:"warn", rxId:rx.id,
        text:`Halfway through the ${INST[rx.instrumentId].name} course. A mid-course assessment now gives a cleaner response curve.`});
    }
    if(pr.left>0){
      const dd = daysBetween(today(), due);
      if(dd < 0) out.push({kind:"late", level:"bad", text:`Session ${pr.done+1} of ${rx.totalSessions} was due on ${fmtDate(due)} — ${Math.abs(dd)} day${Math.abs(dd)===1?"":"s"} ago.`});
      else if(dd<=1) out.push({kind:"soon", level:"warn", text:`Session ${pr.done+1} of ${rx.totalSessions} is due ${dd===0?"today":"tomorrow"} (${INST[rx.instrumentId].name}).`});
      else out.push({kind:"next", level:"info", text:`Next session: ${fmtDate(due)} — ${INST[rx.instrumentId].name}, session ${pr.done+1} of ${rx.totalSessions}.`});
    }
  }
  return out;
}

function membershipState(m){
  const paid = paymentsOf(m.id).reduce((s,x)=>s+x.amount,0);
  const used = DB.sessions.filter(s=>s.patientId===m.patientId && s.status==="completed"
    && s.date>=m.startDate && s.date<=m.endDate).length;
  const daysLeft = daysBetween(today(), m.endDate);
  return {paid, balance: Math.max(0, m.netPayable-paid), settled: paid>=m.netPayable,
    included:m.sessionsIncluded, used, left: Math.max(0, m.sessionsIncluded-used),
    pct: Math.min(100, Math.round(used/Math.max(1,m.sessionsIncluded)*100)),
    daysLeft, expired: daysLeft<0,
    elapsed: Math.min(100, Math.round(daysBetween(m.startDate, today())/Math.max(1,daysBetween(m.startDate,m.endDate))*100))};
}

function billingCheck(){
  const bad = [];
  for(const pl of PLANS) for(const f of pl.fees){
    const expected = Math.round(f.list*(1-f.disc/100));
    if(Math.abs(expected-f.pay) > 1) bad.push({plan:pl.name, months:f.months, list:f.list, disc:f.disc, pay:f.pay, expected});

}
function membershipReminders(pid){
  const out = [], m = activeMembership(pid);
  if(!m){
    const past = membershipsOf(pid)[0];
    if(past) out.push({kind:"renew", level:"warn", text:`Your ${PLAN[past.planId].name} programme ended on ${fmtDate(past.endDate)}. Speak to the front desk about renewing.`});
    else out.push({kind:"enrol", level:"info", text:"No membership programme on record. Sessions can still be booked individually, but a programme covers them at a lower rate."});
    return out;
  }
  const st = membershipState(m);
  if(st.balance>0) out.push({kind:"fee", level:"warn", text:`Fee balance outstanding on your ${PLAN[m.planId].name} programme: ${inr(st.balance)} of ${inr(m.netPayable)}.`});
  if(st.left===0) out.push({kind:"quota", level:"warn", text:`All ${m.sessionsIncluded} sessions included in your ${PLAN[m.planId].name} programme have been used. Further sessions need a renewal or a top-up.`});
  else if(st.left<=2) out.push({kind:"quota", level:"info", text:`${st.left} session${st.left===1?"":"s"} left in your ${PLAN[m.planId].name} programme.`});

  return out;
}

   6. REGISTRATION VALIDATION — a registration is accepted only if every
   rule passes. Failures are returned in full so nothing has to be guessed.

function validateRegistration(f){
  const e = {};
  if(!/^[A-Za-z\u0900-\u097F\u0C00-\u0C7F .'-]{3,60}$/.test(f.name||"")) e.name = "Enter the full name as it appears on an ID, 3 characters or more.";
  const age = Number(f.age);
  if(!age || age<5 || age>105) e.age = "Age must be between 5 and 105.";
  if(!f.sex) e.sex = "Select one.";
  if(!/^[6-9]\d{9}$/.test(f.phone||"")) e.phone = "A 10-digit Indian mobile number starting 6, 7, 8 or 9.";
  if(f.email && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(f.email)) e.email = "That email address is not valid.";
  if((f.address||"").trim().length<8) e.address = "Enter an address we could reach you at.";
  if(!/^[6-9]\d{9}$/.test(f.emergency||"")) e.emergency = "A 10-digit emergency contact number is required.";
  if(f.email && DB.users.some(u=>u.email.toLowerCase()===f.email.toLowerCase())) e.email = "An account already uses this email.";
  if(DB.patients.some(p=>p.phone===f.phone)) e.phone = "A patient is already registered with this mobile number.";
  if((f.password||"").length<8) e.password = "At least 8 characters.";
  else if(!/[A-Za-z]/.test(f.password) || !/\d/.test(f.password)) e.password = "Use at least one letter and one number.";
  if(f.password !== f.password2) e.password2 = "The two passwords do not match.";
  if(!f.consent) e.consent = "Consent is required before any record can be created.";
  const ht = Number(f.height), wt = Number(f.weight);
  if(ht && (ht<80||ht>230)) e.height = "Height in centimetres, between 80 and 230.";
  if(wt && (wt<15||wt>250)) e.weight = "Weight in kilograms, between 15 and 250.";
  return e;
}

/* ==========================================================================
   8. HERO — live 3D ring-coil field, drawn from scratch on canvas.
   The Pulsatron coil is the most characteristic object in this centre,
   so it is the hero rather than a stock gradient.
   ========================================================================== */
function startCoil(){
  const cv = $("#coil"); if(!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0, H=0, t=0, mx=0, my=0, raf=0;
  function size(){ const r=cv.getBoundingClientRect(); const d=Math.min(devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
  size(); addEventListener("resize", size);
  cv.parentElement.addEventListener("mousemove", e=>{
    const r = cv.getBoundingClientRect();
    mx = ((e.clientX-r.left)/r.width-.5)*.55; my = ((e.clientY-r.top)/r.height-.5)*.4;
  });
  // ring geometry
  const rings = [];
  for(let k=0;k<3;k++){
    const pts=[]; const R = 1 - k*0.13;
    for(let i=0;i<96;i++){ const a=i/96*Math.PI*2; pts.push([Math.cos(a)*R, Math.sin(a)*R, (k-1)*0.34]); }
    rings.push(pts);
  }
  const motes = Array.from({length:140},()=>({
    a:Math.random()*Math.PI*2, r:0.35+Math.random()*1.05, z:(Math.random()-.5)*1.5,
    s:0.2+Math.random()*0.8, ph:Math.random()*Math.PI*2 }));
  function proj(p, ry, rx, cx, cy, sc){
    let [x,y,z]=p;
    let x1 = x*Math.cos(ry) - z*Math.sin(ry), z1 = x*Math.sin(ry) + z*Math.cos(ry);
    let y1 = y*Math.cos(rx) - z1*Math.sin(rx); z1 = y*Math.sin(rx) + z1*Math.cos(rx);
    const f = 3.2/(3.2+z1);
    return [cx + x1*sc*f, cy + y1*sc*f, f];
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    const cx = W*0.74, cy = H*0.52, sc = Math.min(W,H)*0.42;
    const ry = t*0.0055 + mx, rx = -0.42 + my;
    // pulse wave rings on the floor
    for(let i=0;i<4;i++){
      const ph = ((t*0.006 + i*0.25) % 1);
      ctx.beginPath();
      ctx.ellipse(cx, cy+sc*0.62, sc*(0.25+ph*1.25), sc*(0.09+ph*0.44), 0, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(192,145,59,${(1-ph)*0.30})`; ctx.lineWidth = 1.2; ctx.stroke();
    }
    // field motes
    for(const m of motes){
      const a = m.a + t*0.0016*m.s;
      const p = proj([Math.cos(a)*m.r, Math.sin(a)*m.r*0.65, m.z], ry, rx, cx, cy, sc);
      const glow = 0.35 + 0.65*Math.abs(Math.sin(t*0.02*m.s + m.ph));
      ctx.beginPath(); ctx.arc(p[0], p[1], 1.5*p[2]*m.s+0.4, 0, Math.PI*2);
      ctx.fillStyle = `rgba(227,193,121,${0.16+glow*0.32})`; ctx.fill();
    }
    // coils
    rings.forEach((pts,k)=>{
      ctx.beginPath();
      pts.forEach((p,i)=>{ const q = proj(p, ry, rx, cx, cy, sc); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); });
      ctx.closePath();
      const pulse = 0.4 + 0.6*Math.abs(Math.sin(t*0.026 - k*0.7));
      ctx.strokeStyle = k===1 ? `rgba(227,193,121,${0.55+pulse*0.45})` : `rgba(120,180,196,${0.30+pulse*0.42})`;
      ctx.lineWidth = k===1 ? 3.4 : 2.2; ctx.stroke();
      // spokes
      if(k===1){ for(let i=0;i<96;i+=12){
        const q = proj(pts[i], ry, rx, cx, cy, sc), c = proj([0,0,0], ry, rx, cx, cy, sc);
        ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(q[0],q[1]);
        ctx.strokeStyle = `rgba(192,145,59,${0.05+pulse*0.09})`; ctx.lineWidth=1; ctx.stroke(); } }
    });
    // core
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,sc*0.5);
    const b = 0.16 + 0.16*Math.abs(Math.sin(t*0.026));
    g.addColorStop(0,`rgba(227,193,121,${b})`); g.addColorStop(1,"rgba(227,193,121,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,sc*0.5,0,Math.PI*2); ctx.fill();
    t += reduce ? 0 : 1;
    raf = requestAnimationFrame(frame);
  }
  cancelAnimationFrame(raf); frame();
}

  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0,Math.min(255, v+amt));

}

function bindRegister(){
  const form = $("#regform"); if(!form) return;
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form).entries());
    f.consent = $("#r_consent").checked;
    const flags = $$("#flagbox input:checked").map(i=>i.value);
    $$(".err").forEach(n=>{n.classList.add("hide"); n.textContent="";});
    const errs = validateRegistration(f);
    if(Object.keys(errs).length){
      for(const k in errs){
        const input = $(`#r_${k}`) || $(`#${k}_err`);
        const box = k==="consent" ? $("#consent_err") : (input && input.parentElement.querySelector(".err"));
        if(box){ box.textContent = errs[k]; box.classList.remove("hide"); }
      }
      $("#regsummary").innerHTML = `<div class="notice bad" style="margin-top:20px"><b>Registration refused</b>
        ${Object.keys(errs).length} field${Object.keys(errs).length===1?"":"s"} did not pass validation. Correct
        the highlighted entries and submit again.</div>`;
      const first = $(".err:not(.hide)"); if(first && first.scrollIntoView) first.scrollIntoView({block:"center", behavior:"smooth"});
      return;
    }
    const {salt, hash} = await hashPw(f.password);
    const uhid = nextUHID();
    const user = {id:uid("u"), role:"patient", name:f.name.trim(),
      email:(f.email||"").trim().toLowerCase() || `${uhid.toLowerCase()}@local`,
      salt, hash, active:true, createdAt:new Date().toISOString()};
    const p = {id:uid("p"), userId:user.id, uhid, name:f.name.trim(), age:Number(f.age), sex:f.sex,
      phone:f.phone, email:user.email, address:f.address.trim(), occupation:f.occupation||"",
      height:Number(f.height)||null, weight:Number(f.weight)||null,
      bmi: (f.height&&f.weight) ? +(Number(f.weight)/Math.pow(Number(f.height)/100,2)).toFixed(1) : null,
      emergency:f.emergency, history:f.history||"", flags, consent:true,
      registeredAt:new Date().toISOString(), registeredBy: current()?current().name:"Self-registration", status:"active"};
    DB.users.push(user); DB.patients.push(p);
    audit("Patient registered", `${uhid} — ${p.name}`);
    save();
    const e2 = eligibility(p);
    const open = INSTRUMENTS.filter(i=>e2[i.id].ok), shut = INSTRUMENTS.filter(i=>!e2[i.id].ok);
    modal("Registration accepted", `${uhid} · ${esc(p.name)}`, `
      <div class="notice good"><b>Record created</b>Your unique hospital ID is <strong>${uhid}</strong>.
      Keep it — you can sign in with either this ID or your email.</div>
      <h3 style="margin-top:20px">What the safety screen decided</h3>
      ${open.length ? `<p style="font-size:.92rem">Open to you: ${open.map(i=>`<span class="chip k">${esc(i.name)}</span>`).join(" ")}</p>`
        : `<div class="notice bad">Your answers rule out every device therapy at this centre. Please see the doctor
           before booking anything — there may still be options, but they need a clinical decision.</div>`}
      ${shut.length ? `<p style="font-size:.92rem">Not available: ${shut.map(i=>`<span class="chip r">${esc(i.name)}</span>`).join(" ")}</p>
        <p style="font-size:.85rem;color:var(--ink-soft)">Reason: ${shut.map(i=>`${esc(i.name)} — ${e2[i.id].blockers.map(b=>esc(FLAG[b].q.toLowerCase())).join("; ")}`).join(" · ")}</p>` : ""}
      <div class="notice" style="margin-top:16px"><b>Next step</b>Sign in and complete your baseline assessment.
      It takes about five minutes and produces your treatment recommendation.</div>
      <div class="row" style="margin-top:18px"><a class="btn" href="#/login" onclick="closeModal()">Sign in now</a></div>`);
  });

function renderItem(it){
  const id = "q_"+it.id;
  if(it.type==="vas") return `<div class="field"><label for="${id}">${esc(it.q)}</label>
    <div class="vas"><span style="font-size:.78rem;color:var(--ink-soft);min-width:7ch">${esc(it.lo)}</span>
    <input class="slider" type="range" id="${id}" name="${it.id}" min="0" max="10" step="1" value="0"
      oninput="this.nextElementSibling.value=this.value">
    <output>0</output><span style="font-size:.78rem;color:var(--ink-soft);min-width:8ch;text-align:right">${esc(it.hi)}</span></div></div>`;
  if(it.type==="scale4") return `<div class="field"><label>${esc(it.q)}</label>
    <div class="row tight">${S4.map(o=>`<label style="font-weight:400;display:inline-flex;gap:6px;align-items:center;margin:0;padding:6px 11px;border:1px solid #DCD1BE;border-radius:100px;cursor:pointer">
      <input type="radio" name="${it.id}" value="${o[0]}" ${o[0]==="0"?"checked":""} style="accent-color:var(--coil)">${o[1]}</label>`).join("")}</div></div>`;
  if(it.type==="one") return `<div class="field"><label for="${id}">${esc(it.q)}</label>
    <select id="${id}" name="${it.id}">${it.opts.map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`).join("")}</select></div>`;
  if(it.type==="yn") return `<div class="checkrow"><input type="checkbox" id="${id}" name="${it.id}" value="yes">
    <label for="${id}">${esc(it.q)}</label></div>`;
  if(it.type==="multi") return `<div class="field"><label>${esc(it.q)}</label>
    <div class="row tight">${it.opts.map(o=>`<label style="font-weight:400;display:inline-flex;gap:6px;align-items:center;margin:0;padding:7px 13px;border:1px solid #DCD1BE;border-radius:100px;cursor:pointer">
      <input type="checkbox" name="${it.id}" value="${o[0]}" style="accent-color:var(--coil)">${esc(o[1])}</label>`).join("")}</div></div>`;
  return "";
}
function collectAssessment(){
  const form = $("#assessform"), x = {};
  for(const sec of ASSESSMENT) for(const it of sec.items){
    if(it.type==="multi") x[it.id] = $$(`input[name="${it.id}"]:checked`, form).map(i=>i.value);
    else if(it.type==="yn") x[it.id] = $(`input[name="${it.id}"]`, form).checked ? "yes" : "no";
    else if(it.type==="scale4") x[it.id] = ($(`input[name="${it.id}"]:checked`, form)||{value:"0"}).value;
    else x[it.id] = $(`[name="${it.id}"]`, form).value;

  return x;
}

function bindTakeAssessment(){
  $$("[data-take]").forEach(b=>b.addEventListener("click", ()=>{
    const rx = b.dataset.rx ? "/"+b.dataset.rx : "";
    go(`#/assessment/${b.dataset.take}${rx}`);
  }));
  $$("[data-view-assess]").forEach(b=>b.addEventListener("click", ()=>{
    const a = DB.assessments.find(x=>x.id===b.dataset.viewAssess); if(!a) return;
    modal(`${a.type==="pre"?"Baseline":a.type==="mid"?"Mid-course":"Post-treatment"} assessment`, fmtDate(a.date),
      domainBars(a.scores) + `<h3 style="margin-top:20px">Answers</h3>` + answerTable(a));
  }));
  $$("[data-inst]").forEach(b=>b.addEventListener("click", ()=>instModal(b.dataset.inst)));
}
function answerTable(a){
  const rows = [];
  for(const sec of ASSESSMENT) for(const it of sec.items){
    let v = a.answers[it.id];
    if(Array.isArray(v)) v = v.map(k=>(REGIONS.find(r=>r[0]===k)||[,k])[1]).join(", ") || "none";
    else if(it.type==="one") v = (it.opts.find(o=>o[0]===v)||[,v])[1];
    else if(it.type==="scale4") v = (S4.find(o=>o[0]===String(v))||[,v])[1];
    rows.push(`<tr><th style="width:56%">${esc(it.q)}</th><td>${esc(v)}</td></tr>`);
  }
  return `<div class="tbl-scroll"><table><tbody>${rows.join("")}</tbody></table></div>
    ${a.note?`<div class="slab" style="margin-top:12px"><strong>Patient note</strong><br>${esc(a.note)}</div>`:""}`;
}
function submitAssessment(patient, redirect){
  const form = $("#assessform"); if(!form) return;
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const type = $("#a_type").value, rxId = $("#a_rx").value || null;
    const answers = collectAssessment();
    const a = {id:uid("a"), patientId:patient.id, type, rxId, date:today(),
      recordedAt:new Date().toISOString(), by:current().name, answers, note:$("#a_note").value.trim()};
    a.scores = scoreAssessment(a);
    a.recs = recommend(a, patient);
    DB.assessments.push(a); audit("Assessment recorded", `${patient.uhid} — ${type}, index ${a.scores.index}`); save();
    const prev = assessOf(patient.id).filter(x=>x.id!==a.id);
    const base = prev.find(x=>x.type==="pre");
    modal("Assessment recorded", `${esc(patient.name)} · ${a.type} · ${fmtDate(a.date)}`, `
      ${base && type!=="pre" ? `<div class="notice ${a.scores.index>=base.scores.index?"good":"warn"}">
        <b>Change since baseline</b>Wellness index ${base.scores.index} → ${a.scores.index}
        (${a.scores.index-base.scores.index>0?"+":""}${a.scores.index-base.scores.index}).
        Pain ${base.scores.pain} → ${a.scores.pain}. Function difficulty ${base.scores.fn} → ${a.scores.fn}.</div>`:""}
      ${domainBars(a.scores)}
      <div style="margin-top:20px">${recommendationHTML(a, patient, current().role==="doctor")}</div>`);
    setTimeout(()=>{ $$("[data-inst]").forEach(b=>b.addEventListener("click",()=>instModal(b.dataset.inst)));
      $$("[data-prescribe]").forEach(b=>b.addEventListener("click",()=>prescribeModal(b.dataset.pid, b.dataset.prescribe))); },0);
    toast("Assessment saved", "good");
    history.replaceState(null,"",redirect);
  });
}

  go2.addEventListener("click", async ()=>{
    const u = current(), err = $("#pw_err"); err.classList.add("hide");
    if(!(await checkPw($("#pw_old").value, u))){ err.textContent="Current password is not correct."; err.classList.remove("hide"); return; }
    const np = $("#pw_new").value;
    if(np.length<8 || !/[A-Za-z]/.test(np) || !/\d/.test(np)){ err.textContent="New password needs 8+ characters with a letter and a number."; err.classList.remove("hide"); return; }
    const h = await hashPw(np); u.salt=h.salt; u.hash=h.hash; audit("Password changed"); save();
    toast("Password changed","good"); $("#pw_old").value=""; $("#pw_new").value="";
  });
};

    <form id="rxform">

      </div>
      <div class="field"><label for="rx_params">Parameters</label><input id="rx_params" type="text"
        placeholder="${esc(i.params.slice(0,2).map(x=>x[0]+": "+x[1]).join(" · "))}"></div>
      <div class="field"><label for="rx_notes">Clinical reasoning</label><textarea id="rx_notes"
        placeholder="Why this instrument, what response is expected, what would change the plan"></textarea></div>
      ${el[sel].cautions.length?`<div class="notice warn"><b>Caution flags on this patient</b>
        ${el[sel].cautions.map(c=>esc(FLAG[c].q)).join("; ")}. Confirm you have assessed these before prescribing.</div>`:""}
      <div class="row" style="margin-top:18px"><button class="btn" type="submit">Issue the prescription</button>

  });
  $("#rxform").addEventListener("submit", e=>{
    e.preventDefault();
    const rx = {id:uid("rx"), patientId:p.id, doctorId:current().id, instrumentId:$("#rx_i").value,

      notes:$("#rx_notes").value.trim(), status:"active", issuedAt:new Date().toISOString()};

function pairedOutcomes(){
  const rows = [];
  for(const p of DB.patients){
    const as = assessOf(p.id);
    const pre = as.find(a=>a.type==="pre"), post = [...as].reverse().find(a=>a.type==="post");
    if(!pre || !post) continue;
    const rx = rxOf(p.id).find(r=>r.id===post.rxId) || rxOf(p.id)[0];
    const pr = rx ? rxProgress(rx) : null;
    rows.push({p, pre, post, rx, pr,
      dIndex: post.scores.index-pre.scores.index, dPain: post.scores.pain-pre.scores.pain,
      dFn: post.scores.fn-pre.scores.fn, dSys: post.scores.systemic-pre.scores.systemic,
      days: daysBetween(pre.date, post.date)});
  }
  return rows;
}

function csvEscape(v){ v = v==null?"":String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; }
function toCSV(head, rows){ return [head, ...rows].map(r=>r.map(csvEscape).join(",")).join("\n"); }
function saveFile(name, text, type){
  const a = document.createElement("a"); let revoke = null;
  try{ a.href = URL.createObjectURL(new Blob([text], {type:type||"text/plain;charset=utf-8"})); revoke = a.href; }
  catch(err){ a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(text); }
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  if(revoke) setTimeout(()=>URL.revokeObjectURL(revoke), 4000);
}

      r.pre.scores.neuro, r.post.scores.neuro, r.pre.scores.circ, r.post.scores.circ]);

      "post_pain","delta_pain","pre_function","post_function","delta_function","pre_systemic","post_systemic",

  }

      return [deid?studyCode(p):p.uhid, s.seq, s.date, s.instrumentId, s.region, s.params, s.minutes,
        s.vasBefore, s.vasAfter, (s.vasBefore!=null&&s.vasAfter!=null)?(s.vasBefore-s.vasAfter):"", s.status, s.therapist, s.note];});

  if(kind==="assessments"){

    saveFile(`psriem-assessment-items-${stamp}.csv`, toCSV(head, rows), "text/csv");
  }
  if(kind==="bodymap"){
    const head = ["subject","assess_date","stage","view","mark_type","region","severity","x","y","note"];
    const rows = [];
    for(const rec of DB.clinical){
      const p2 = rec.patientId ? patientById(rec.patientId) : null;

        rows.push([p2 ? (deid?studyCode(p2):p2.uhid) : (rec.d.clientId||"unlinked"), rec.d.assessDate,

/* ───────────────── dawn canvas: sunrise over still water ───────────────── */
function dawn(){
  const cv = $("#dawn"); if(!cv) return;
  const ctx = cv.getContext("2d");
  const slow = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,t=0;
  const size=()=>{const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
    W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);};
  size(); addEventListener("resize", size);
  const petals = 12;
  function frame(){
    ctx.clearRect(0,0,W,H);
    const cx = W>760 ? W*0.80 : W*0.5, cy = H*0.36, R = Math.min(W,H)*0.20;
    const pulse = 0.5+0.5*Math.sin(t*0.012);
    // sun
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*2.6);
    g.addColorStop(0,`rgba(255,214,140,${0.55+pulse*0.25})`);
    g.addColorStop(.45,"rgba(255,196,138,0.22)");
    g.addColorStop(1,"rgba(255,196,138,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*2.6,0,7); ctx.fill();
    ctx.fillStyle=`rgba(255,232,190,${0.75})`; ctx.beginPath(); ctx.arc(cx,cy,R*0.52,0,7); ctx.fill();
    // lotus petals radiating
    for(let i=0;i<petals;i++){
      const a = i/petals*Math.PI*2 + t*0.0016;
      const len = R*(1.25 + 0.13*Math.sin(t*0.02 + i));
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(R*0.30, -len*0.42, 0, -len);
      ctx.quadraticCurveTo(-R*0.30, -len*0.42, 0, 0);
      ctx.strokeStyle = `rgba(185,139,49,${0.13+0.10*pulse})`; ctx.lineWidth=1.15; ctx.stroke();
      ctx.restore();
    }
    // still water: horizontal light bands
    for(let i=0;i<7;i++){
      const y = cy + R*1.5 + i*13 + Math.sin(t*0.02+i)*1.6;
      if(y>H) break;
      ctx.beginPath(); ctx.moveTo(cx-R*(2.1-i*0.20), y); ctx.lineTo(cx+R*(2.1-i*0.20), y);
      ctx.strokeStyle=`rgba(255,222,178,${0.30-i*0.036})`; ctx.lineWidth=2.4-i*0.22; ctx.stroke();
    }
    // drifting motes
    for(let i=0;i<26;i++){
      const p = (t*0.00035 + i/26)%1;
      const x = cx - R*2.4 + p*R*4.8, y = cy + Math.sin(i*2.1 + t*0.006)*R*1.1;
      ctx.beginPath(); ctx.arc(x,y,1.1+Math.sin(i)*0.5,0,7);
      ctx.fillStyle=`rgba(185,139,49,${0.10+0.16*Math.abs(Math.sin(t*0.01+i))})`; ctx.fill();
    }
    if(!slow) t++;
    requestAnimationFrame(frame);
  }
  frame();
}
